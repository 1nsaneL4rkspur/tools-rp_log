<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劇情整理小工具">
<title>劇情整理小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE3; --surface:#F4F5F1; --ink:#1E2433; --mute:#5C6373; --line:#C8CDC3;
  --jade:#3B7368; --jade-ink:#FFFFFF; --jade-soft:#D3E2DC;
  --seal:#AE402B; --seal-soft:#F0D9D1;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --surface:#1D232A; --ink:#E4E7E1; --mute:#9AA1AC; --line:#333B44;
    --jade:#72B3A5; --jade-ink:#0F1A17; --jade-soft:#22352F;
    --seal:#E27D65; --seal-soft:#3A2420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1D232A; --ink:#E4E7E1; --mute:#9AA1AC; --line:#333B44;
  --jade:#72B3A5; --jade-ink:#0F1A17; --jade-soft:#22352F;
  --seal:#E27D65; --seal-soft:#3A2420; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.story{flex:1;min-width:0}
.story h1{margin:0;font-family:var(--serif);font-weight:900;font-size:1.3rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story p{margin:0;color:var(--mute);font-size:.82rem}
.seal{flex:none;width:52px;height:52px;border:2px solid var(--seal);border-radius:4px;color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);line-height:1;transform:rotate(-3deg);background:var(--seal-soft)}
.seal small{font-size:.66rem;font-weight:600}
.seal b{font-size:1.25rem;font-weight:900;margin:2px 0}

main{max-width:680px;margin:0 auto;padding:6px 18px calc(110px + env(safe-area-inset-bottom,0px))}

/* sections */
.sec{padding:20px 0 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:1.12rem;display:flex;align-items:center;gap:10px}
.stepn{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--jade);color:var(--jade);font-family:var(--sans);font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sec.muted h2{color:var(--mute)}
.sec.muted .stepn{border-color:var(--line);color:var(--mute)}
.hint{margin:0 0 12px;color:var(--mute);font-size:.88rem}
h3.sub{margin:18px 0 8px;font-size:.95rem;font-weight:700;color:var(--mute)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:.95rem;cursor:pointer;min-height:42px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:700}
.btn.big{width:100%;min-height:52px;font-size:1.02rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row > .grow{flex:1}
.stack > * + *{margin-top:10px}

textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:110px;line-height:1.55}
pre.prev{white-space:pre-wrap;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;font-family:var(--sans);font-size:.85rem;max-height:260px;overflow:auto;margin:10px 0 0}

.notice{background:var(--seal-soft);border-left:3px solid var(--seal);padding:12px 14px;border-radius:0 10px 10px 0;margin:16px 0 0;font-size:.9rem}
.notice .row{margin-top:8px}
.ok{background:var(--jade-soft);border-left-color:var(--jade)}

/* segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:16px 0 4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;min-height:40px;font-size:.92rem;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--jade);color:var(--jade-ink);font-weight:700}
.seg button .n{font-size:.78rem;opacity:.8;margin-left:3px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--surface)}
button.chip{cursor:pointer;min-height:34px;padding:4px 12px;font-size:.88rem}
button.chip.on{border-color:var(--jade);background:var(--jade-soft);color:var(--ink);font-weight:700}

/* parsed preview */
.pitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--surface)}
.pitem .g{display:grid;grid-template-columns:72px 1fr 1fr;gap:6px}
.pitem .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pitem input,.pitem select,.pitem textarea{padding:7px 9px;border-radius:8px;background:var(--bg)}
.pitem textarea{min-height:60px;margin-top:6px}
.pitem .k{font-size:.75rem;color:var(--mute);display:block;margin-bottom:2px}
.pitem .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.82rem;color:var(--mute)}
.err{color:var(--seal);font-size:.85rem;margin:6px 0 0}

/* timeline */
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:16px 0 0}
.filters select{padding:8px 8px;font-size:16px}
.day{margin-top:22px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dseal{font-family:var(--serif);color:var(--seal);border:1.5px solid var(--seal);border-radius:3px;padding:1px 8px;font-size:.85rem;font-weight:600;background:var(--seal-soft)}
.dseal b{font-size:1.05rem;font-weight:900;margin:0 2px}
.dayhead .rule{flex:1;height:1px;background:var(--line)}
.dayhead .cnt{font-size:.78rem;color:var(--mute)}
.ev{border-left:2px solid var(--line);margin-left:12px;padding:10px 0 10px 16px;position:relative}
.ev::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--mute)}
.ev.h::before{background:var(--seal);border-color:var(--seal)}
.ev.m::before{border-color:var(--jade)}
.ev-btn{all:unset;display:block;width:100%;cursor:pointer}
.ev-btn:focus-visible{outline:2px solid var(--jade);outline-offset:3px;border-radius:6px}
.ev .sum{font-size:1rem;line-height:1.55}
.ev .meta{font-size:.8rem;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.ev .chips{margin-top:6px}
.ev .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.imp-tag{color:var(--seal);font-weight:700}

/* list items */
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:700}
.item .desc{margin-top:2px}
.item .meta{font-size:.8rem;color:var(--mute);margin-top:4px}
.stale{display:inline-block;font-size:.75rem;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:500;vertical-align:2px}
.item .row{margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--jade);flex:none}
.done .desc{text-decoration:line-through;color:var(--mute)}

.card-draw{border:1.5px solid var(--jade);border-radius:12px;padding:18px;margin-top:12px;background:var(--jade-soft)}
.card-draw .cat{font-size:.8rem;color:var(--mute)}
.card-draw .txt{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin-top:4px}
ol.qs{margin:10px 0 0;padding-left:1.4em}
ol.qs li{margin:6px 0}

/* characters */
.char{border-bottom:1px solid var(--line)}
.char-btn{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;cursor:pointer}
.char-btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:1.1rem}
.char-btn .info{flex:1;min-width:0}
.char-btn .info b{display:block}
.char-btn .info span{font-size:.82rem;color:var(--mute)}
.chev{color:var(--mute);transition:transform .15s}
.char.open .chev{transform:rotate(90deg)}
.cdetail{padding:0 0 16px 52px}
.stt{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:.9rem}
.stt dt{color:var(--mute)}
.stt dd{margin:0}
.stt dd small{color:var(--mute)}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:.85rem}
.hist li{padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start}
.hist li .t{flex:1}
.hist li .d{color:var(--mute);flex:none;font-size:.78rem;padding-top:2px}
.secret{padding:14px 0;border-bottom:1px solid var(--line)}
.secret .name{font-weight:700}
.secret .knows{font-size:.85rem;margin-top:6px}
.secret .knows span{color:var(--mute);margin-right:6px}
.chip.yes{border-color:var(--jade);color:var(--jade)}
.chip.no{color:var(--mute);border-style:dashed}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:transparent;padding:10px 2px 12px;min-height:56px;font-size:.82rem;color:var(--mute);cursor:pointer;position:relative}
.tab.on{color:var(--jade);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--jade)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (min-width:720px){.fab{right:calc(50% - 340px + 18px)}}
@media (max-width:760px){body.typing .tabbar,body.typing .fab{display:none}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.45)}
.panel{position:relative;width:100%;max-width:680px;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
.panel h3{margin:0 0 14px;font-family:var(--serif);font-size:1.15rem}
.fld{display:block;margin-bottom:12px}
.fld > span{display:block;font-size:.82rem;color:var(--mute);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--mute);text-align:center;padding:36px 10px;font-size:.92rem}
.small{font-size:.82rem;color:var(--mute)}

/* v2 additions */
.mdiv{display:flex;align-items:center;gap:10px;margin:30px 0 0;font-family:var(--serif);font-weight:900;font-size:1.05rem;color:var(--ink)}
.mdiv::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.18}
.gap{margin:14px 0 0 12px;padding:6px 0 6px 16px;border-left:2px dotted var(--mute);font-size:.8rem;color:var(--mute)}
.dseal.vague{border-style:dashed;background:transparent;color:var(--mute);border-color:var(--mute)}
.warn-tag{color:var(--seal);font-weight:700}
.modebar{margin-top:16px}
.prof{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:.9rem;margin:0 0 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.prof dt{color:var(--mute)}
.prof dd{margin:0}
.grp{margin:22px 0 2px;font-size:.85rem;font-weight:700;color:var(--mute)}
.typetag{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--mute);font-weight:500;vertical-align:2px}
.typetag.self{border-color:var(--jade);color:var(--jade)}
.avatar.other{background:transparent;border:1.5px dashed var(--mute);color:var(--mute)}
.seal small.mn{font-size:.62rem}
body.setup .tabbar,body.setup .fab,body.setup .seal{display:none}
.ev.q::before{border-radius:2px;background:var(--jade-soft);border-color:var(--jade);transform:rotate(45deg)}
.qt{font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.65}
.qtype{color:var(--jade);font-weight:700}
.fv{all:unset;cursor:pointer;border-bottom:1px dashed var(--mute);line-height:1.5}
.fv:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.chip.add{border-style:dashed;color:var(--jade);background:transparent}
.stt dd .chips{gap:5px}
.stt{row-gap:8px}
details.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
details.fold summary{cursor:pointer;font-size:.88rem;color:var(--mute);padding:6px 0;list-style-position:inside}
.improw{padding:12px 0;border-bottom:1px solid var(--line)}
.sec-btn{all:unset;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer}
.sec-btn .name{flex:1}
.sec-btn:focus-visible{outline:2px solid var(--jade);outline-offset:3px;border-radius:6px}
.chip.subj{border-color:var(--seal);color:var(--seal);background:var(--seal-soft)}
button.chip.subj{font-size:.85rem}
.chip.ck{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.chip.ck input{width:18px;height:18px;margin:0;accent-color:var(--jade)}
.chip.ck:has(input:checked){border-color:var(--jade);background:var(--jade-soft)}
.fld > .chips{margin-top:2px}
.fab span{font-size:1.45rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.dayfold{display:block;margin:2px 0 0 30px;background:none;border:0;padding:8px 0;min-height:40px;color:var(--jade);font-size:.85rem;font-weight:700;cursor:pointer;text-align:left}
.dayfold:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.kindtag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid var(--jade);color:var(--jade);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.kindtag.cf{border-color:var(--seal);color:var(--seal)}
.grp-btn{all:unset;display:block;width:100%;cursor:pointer;padding:4px 0}
.grp-btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.seal.undated{border-style:dashed;background:transparent}
.seal.undated b{font-size:.95rem;margin-top:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ===== v2：當代展間風格（全站） ===== */
body.v2{
  --bg:#E8E8E5; --surface:#F4F4F1; --ink:#111214; --mute:#6B6D70; --line:#CBCBC7; --line2:#8E908B;
  --accent:#1F3BFF; --accent-ink:#FFFFFF; --accent-soft:#DDE2FF;
  --ghost:#ADAEA9; --grid:rgba(17,18,20,.055); --stripe:rgba(17,18,20,.2);
  --jade:var(--accent); --jade-ink:var(--accent-ink); --jade-soft:var(--accent-soft);
  --seal:var(--ink); --seal-soft:transparent;
  --disp:"Space Grotesk",var(--sans);
  overflow-x:clip;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body.v2{
    --bg:#0E0F11; --surface:#17181B; --ink:#ECECE8; --mute:#8B8D91; --line:#2B2D31; --line2:#55585E;
    --accent:#4A68FF; --accent-soft:#151B3D; --ghost:#3A3C42; --grid:rgba(236,236,232,.045); --stripe:rgba(236,236,232,.24);
  }
}
:root[data-theme="dark"] body.v2{
  --bg:#0E0F11; --surface:#17181B; --ink:#ECECE8; --mute:#8B8D91; --line:#2B2D31; --line2:#55585E;
  --accent:#4A68FF; --accent-soft:#151B3D; --ghost:#3A3C42; --grid:rgba(236,236,232,.045); --stripe:rgba(236,236,232,.24);
}
body.v2 :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頁首：日期被底線裁切的大數字 */
body.v2 .top{background:var(--bg);border-bottom:1px solid var(--ink);overflow:hidden}
body.v2 .top-in{align-items:flex-end;padding:14px 18px 0;gap:18px}
body.v2 .story{padding-bottom:12px}
body.v2 .story h1{font-family:var(--sans);font-weight:900;font-size:1.12rem;letter-spacing:.02em}
body.v2 .story p{font-family:var(--disp);font-size:.78rem;letter-spacing:.01em}
body.v2 .seal{width:auto;height:auto;border:0;border-radius:0;background:none;transform:none;color:var(--ink);
  flex-direction:row;align-items:flex-start;gap:6px;font-family:var(--disp);line-height:1}
body.v2 .seal small.mn{font-family:var(--sans);font-size:.72rem;font-weight:500;color:var(--mute);padding-top:.35rem}
body.v2 .seal b{font-family:var(--disp);font-weight:300;font-size:3.6rem;line-height:.8;letter-spacing:-.04em;margin:0 0 -.2em;font-variant-numeric:tabular-nums}
body.v2 .seal #sealD{display:none}
body.v2 .seal.undated b{font-family:var(--sans);font-weight:200;font-size:2.2rem;margin-bottom:-.12em}

/* 主欄：可見的系統網格 */
body.v2 main{min-height:calc(100dvh - 78px);
  background:
    linear-gradient(to right,var(--grid) 1px,transparent 1px) 18px 0/calc((100% - 36px) / 4) 100% repeat-x;
}

/* 篩選與操作：完全秩序 */
body.v2 .btn{border-radius:0;border-color:var(--line2);background:transparent}
body.v2 .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
body.v2 .btn.danger{background:var(--ink);border-color:var(--ink);color:var(--bg)}
body.v2 .btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;padding-left:4px;padding-right:10px}
body.v2 .btn:active{transform:none;background:var(--surface)}
body.v2 .btn.primary:active{filter:brightness(.92);background:var(--accent)}
body.v2 textarea,body.v2 input[type=text],body.v2 input[type=number],body.v2 select{border-radius:0;border-color:var(--line2);background:var(--surface)}
body.v2 .filters{gap:0;margin-top:20px}
body.v2 .filters select + select{border-left:0}

  const p=cObj(c.profile);PROF.forEach(([k])=>{if(p[k]!=null&&p[k]!=='')o.profile[k]=cStr(p[k])});
  if(isObj(c.cur)&&Array.isArray(c.hist)){
    const single={},rel={},items=cObj(c.cur.items);
    Object.entries(cObj(c.cur.single)).forEach(([k,v])=>{if(SINGLE.includes(k)&&isObj(v))single[k]={v:cStr(v.v),date:cDate(v.date)}});
    Object.entries(cObj(c.cur.rel)).forEach(([k,v])=>{if(okKey(k)&&isObj(v))rel[k]={v:cStr(v.v),date:cDate(v.date)}});
    o.cur={single,rel,items:{
      '持有物':cArr(items['持有物']).filter(isObj).map(x=>({id:cId(x.id),v:cStr(x.v),date:cDate(x.date)})),
      '知情':cArr(items['知情']).filter(isObj).map(x=>{const r={id:cId(x.id),note:cStr(x.note),date:cDate(x.date)};if(okId(x.sid))r.sid=x.sid;else if(cStr(x.v))r.v=cStr(x.v);return r}).filter(x=>x.sid||x.v)
    }};
    o.hist=c.hist.filter(isObj).map(h=>{
      const r={id:cId(h.id),cat:pickE(h.cat,CATS,'心境'),date:cDate(h.date),seg:cInt(h.seg)};
      ['from','to','target','note'].forEach(k=>{if(h[k]!=null)r[k]=cStr(h[k])});
      if(h.act!=null)r.act=pickE(h.act,['取得','失去','得知','移除','變更'],'');
      if(okId(h.sid))r.sid=h.sid;return r;
    });
  }else{
    o.states=cArr(c.states).filter(isObj).map(x=>({cat:pickE(x.cat,CATS,'心境'),target:cStr(x.target),change:cStr(x.change),date:cDate(x.date),seg:cInt(x.seg)}));

  return o;
}

/* ---------- calendar ---------- */
const GD=[31,28,31,30,31,30,31,31,30,31,30,31];
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const custom=()=>S.cal.type==='custom'&&S.cal.months.length>0;
function mCount(){return custom()?S.cal.months.length:12}
function mDays(y,m){if(custom()){const mo=S.cal.months[m-1];return mo?mo.days:0}return m===2&&isLeap(y)?29:(GD[m-1]||0)}
function yLen(){return S.cal.months.reduce((a,b)=>a+(b.days||0),0)||365}
function daysBeforeYear(y){if(custom())return (y-1)*yLen();const p=y-1;return 365*p+Math.floor(p/4)-Math.floor(p/100)+Math.floor(p/400)}
function idx(dt){const m=dt.prec==='y'?1:dt.m,d=dt.prec==='d'?dt.d:1;let n=daysBeforeYear(dt.y);for(let i=1;i<m;i++)n+=mDays(dt.y,i);return n+d}
function fromIdx(n){
  let y=Math.floor((n-1)/(custom()?yLen():365.2425))+1;
  while(daysBeforeYear(y)>=n)y--;while(daysBeforeYear(y+1)<n)y++;
  let r=n-daysBeforeYear(y),m=1;while(m<mCount()&&r>mDays(y,m)){r-=mDays(y,m);m++}
  return D(y,m,r);
}
const addDays=(dt,n)=>fromIdx(idx(dt)+n);
const toExact=dt=>dt.prec==='d'?{...dt}:fromIdx(idx(dt));
function sortKey(dt){return idx(dt)-(dt.prec==='d'?0:dt.prec==='m'?0.5:0.6)}
function valid(dt){if(!dt)return false;if(dt.prec==='y')return true;if(dt.m<1||dt.m>mCount())return false;if(dt.prec==='m')return true;return dt.d>=1&&dt.d<=mDays(dt.y,dt.m)}
function monthName(m){return (custom()&&S.cal.months[m-1]&&S.cal.months[m-1].name)||`${m}月`}
function fmt(dt){if(!dt)return'';if(dt.prec==='y')return `${dt.y}年`;if(dt.prec==='m')return `${dt.y}年${monthName(dt.m)}`;return `${dt.y}年${monthName(dt.m)}${dt.d}日`}
function storyDay(){return idx(S.cur)-idx(S.start)+1}
const curY=()=>S.undated?null:S.cur.y;
const curText=()=>S.undated?'':fmt(S.cur);
function setFirstDate(dt){S.start={...dt};S.cur={...dt};S.undated=false}
function parseDate(str,prevY){
  str=String(str||'').trim();let m;
  const names=custom()?S.cal.months.map(x=>x.name).filter(Boolean):[];
  if(names.length){
    const re=new RegExp('(?:(\\d+)\\s*年)?\\s*('+names.map(escRe).join('|')+')\\s*(?:(\\d+)\\s*日)?');
    m=str.match(re);
    if(m&&(m[1]||prevY)){const mi=S.cal.months.findIndex(x=>x.name===m[2])+1,y=m[1]?+m[1]:prevY;return {date:m[3]?D(y,mi,+m[3]):Dm(y,mi),rest:str.replace(m[0],'')}}
  }
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d{1,5})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月/)))return {date:Dm(+m[1],+m[2]),rest:str.replace(m[0],'')};
  if(prevY&&(m=str.match(/(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(prevY,+m[1],+m[2]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年/)))return {date:Dy(+m[1]),rest:str.replace(m[0],'')};
  return null;
}

/* ---------- helpers ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}
async function copy(text,msg){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}
  }
  toast(ok?(msg||'已複製'):'無法自動複製，請手動選取文字');return ok;
}
const segLabel=n=>n===0?'序章':`第 ${n} 段`;
function curSeg(){return S.segments.filter(s=>s.n>0).length}
function graphemes(t){t=String(t);try{if(typeof Intl!=='undefined'&&Intl.Segmenter)return [...new Intl.Segmenter('zh-Hant',{granularity:'grapheme'}).segment(t)].map(x=>x.segment)}catch(e){}return [...t]}
function nameHash(t){let h=2166136261;for(const ch of String(t)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function avAuto(name){
  let h=nameHash(name),out='',used=0;
  const cell=(i,k)=>{const x=(i%2)*20,y=(i>>1)*20,r=(h>>>(8+i*2))&3;
    switch(k){
      case 1:return `<rect x="${x}" y="${y}" width="20" height="20"/>`;
      case 2:{const cx=x+(r&1?20:0),cy=y+(r&2?20:0),sx=r&1?-1:1,sy=r&2?-1:1;return `<path d="M${cx} ${cy}h${20*sx}a20 20 0 0 ${sx*sy>0?1:0} ${-20*sx} ${20*sy}z"/>`}
      case 3:return r&1?`<path d="M${x} ${y}h20v20z"/>`:`<path d="M${x} ${y+20}h20v-20z"/>`;
      case 4:return `<rect x="${x}" y="${y+(r&1?10:0)}" width="20" height="10"/>`;
      case 5:return `<circle cx="${x+10}" cy="${y+10}" r="7"/>`;
      default:return '';
    }};
  const MAP=[0,2,3,1,2,5,0,4];let sq=0;for(let i=0;i<4;i++){let k=MAP[(h>>>(i*3))&7];if(k===1&&sq++)k=2;if(i===3&&used<2&&!k)k=2+(h%4);if(k)used++;out+=cell(i,k)}
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor">${out}</g></svg>`;
}
function avInner(c){if(c.av&&c.av.t==='txt')return esc(c.av.v);return avAuto(c.name)}
function newChar(name,type){return {id:uid(),name,type:type||'major',profile:{},cur:{single:{},rel:{},items:{'持有物':[],'知情':[]}},hist:[]}}
function ensureChar(name,type){name=String(name||'').trim();if(!name)return null;let c=S.characters.find(c=>c.name===name);if(!c){c=newChar(name,type);S.characters.push(c)}return c}
const LOSE_RE=/^(失去|遺失|交出|被奪|被奪走|丟失|用掉|消耗|移除|歸還)\s*[：:]?\s*/;
const GAIN_RE=/^(取得|獲得|得到|拿到|收到)\s*[：:]?\s*/;
function isLose(act,change){return /失去|遺失|交出|被奪|丟失|用掉|消耗|移除|歸還/.test(act||'')||(!act&&LOSE_RE.test(change||''))}
const stripLose=s=>String(s||'').replace(LOSE_RE,'').trim();
const stripGain=s=>String(s||'').replace(GAIN_RE,'').trim();
function findItem(list,name){return list.find(x=>x.v===name)||list.find(x=>name&&(x.v.includes(name)||name.includes(x.v)))}
function secretById(id){return S.secrets.find(x=>x.id===id)}
function ensureSecret(text){text=String(text||'').trim();let x=S.secrets.find(y=>y.text===text);if(!x){x={id:uid(),text,subjects:[]};S.secrets.push(x)}return x}
function knowersOf(sec){return S.characters.filter(c=>c.cur.items['知情'].some(x=>x.sid===sec.id)&&!sec.subjects.includes(c.name))}
function normSecrets(){S.secrets.forEach(sec=>sec.subjects.forEach(n=>{const c=S.characters.find(x=>x.name===n);if(c)c.cur.items['知情']=c.cur.items['知情'].filter(x=>x.sid!==sec.id)}))}
function applyState(c,st,date,seg){
  const cat=st.cat,h={id:uid(),cat,date:{...date},seg};
  if(SINGLE.includes(cat)){h.from=c.cur.single[cat]?c.cur.single[cat].v:'';h.to=st.change;c.cur.single[cat]={v:st.change,date:{...date}}}
  else if(cat==='關係'){const t=st.target||'（未指定）';h.target=t;h.from=c.cur.rel[t]?c.cur.rel[t].v:'';h.to=st.change;c.cur.rel[t]={v:st.change,date:{...date}}}
  else if(cat==='持有物'){
    const list=c.cur.items['持有物'];
    if(isLose(st.act,st.change)){const nm=stripLose(st.change);const it=findItem(list,nm);if(it)c.cur.items['持有物']=list.filter(x=>x!==it);h.act='失去';h.to=it?it.v:nm}
    else{const nm=stripGain(st.change);list.push({id:uid(),v:nm,date:{...date}});h.act='取得';h.to=nm}
  }else if(cat==='知情'){
    let sec=st.sid&&st.sid!=='new'?secretById(st.sid):null;
    if(!sec)sec=ensureSecret(st.target||st.change);
    splitNames(st.subjects).forEach(n=>{ensureChar(n);if(!sec.subjects.includes(n))sec.subjects.push(n)});
    const note=st.target?st.change:'';
    if(sec.subjects.includes(c.name)){normSecrets();return}
    if(!c.cur.items['知情'].some(x=>x.sid===sec.id))c.cur.items['知情'].push({id:uid(),sid:sec.id,note,date:{...date}});
    normSecrets();
    h.act='得知';h.sid=sec.id;h.to=sec.text;h.note=note;
  }
  c.hist.push(h);
}
function histText(h){
  if(h.act==='變更')return `${h.cat}：${h.from} → ${h.to}`;
  if(h.cat==='持有物')return `持有物：${h.act==='失去'?'－':'＋'}${h.to}`;
  if(h.cat==='知情'){const sec=h.sid&&secretById(h.sid);return `知情：${h.act==='移除'?'移除':'得知'}「${sec?sec.text:h.to}」${h.note?`（${h.note}）`:''}`}
  return `${h.cat==='關係'?`對${h.target}`:h.cat}：${h.from||'（無）'} → ${h.to}`;
}
function migrateChar(c){
  if(c.cur&&c.hist)return c;
  const n=newChar(c.name,c.type==='other'?'major':c.type);n.id=c.id;n.profile=c.profile||{};if(c.av)n.av=c.av;
  (c.states||[]).slice().sort((a,b)=>sortKey(a.date)-sortKey(b.date)).forEach(s=>applyState(n,{cat:s.cat,target:s.target,act:'',change:s.change},s.date,s.seg));
  return n;
}
function migrateAll(){
  const keep=S;
  Object.values(DB.stories).forEach(st=>{S=st;st.quotes=st.quotes||[];st.secrets=st.secrets||[];
    (st.conflicts||[]).forEach(c=>{const nm=String(c.content||'').slice(0,14)||'衝突';st.foreshadows.push({id:c.id||uid(),name:nm,content:c.content||'',status:c.resolved?'resolved':'developing',kind:'conflict',chars:c.chars||[],plantedSeg:c.seg||0,lastSeg:c.seg||0})});st.conflicts=[];
    st.foreshadows.forEach(f=>{if(!f.kind)f.kind='foreshadow'});
    st.characters.forEach(c=>{if(c.type==='other'||!CTYPE[c.type])c.type='major'});
    st.notes.forEach(x=>{x.kind='pending'});st.characters=st.characters.map(migrateChar);
    st.characters.forEach(c=>{c.cur.items['知情'].forEach(x=>{if(!x.sid){x.sid=ensureSecret(x.v).id;delete x.v}});c.hist.forEach(h=>{if(h.cat==='知情'&&!h.sid){const f=st.secrets.find(y=>y.text===h.to);if(f)h.sid=f.id}})})});
  S=keep;
  const st=DB.settings;
  if((st.tplVer||0)<7){
    if([OLD_TEMPLATE,OLD3_TEMPLATE,OLD4_TEMPLATE,OLD5_TEMPLATE,OLD6_TEMPLATE].includes(st.template))st.template=DEFAULT_TEMPLATE;else if(st.template!==DEFAULT_TEMPLATE)st.tplNotice=true;
    if([OLD_PRO,OLD3_PRO,OLD4_PRO,OLD5_PRO].includes(st.proTemplate))st.proTemplate=DEFAULT_PRO;
    st.tplVer=7;save();
  }
}

const FIELD_ALIAS={'日期':'時間','時間點':'時間','發生時間':'時間','故事時間':'時間','人物':'角色','登場角色':'角色','登場人物':'角色','相關人物':'角色','角色名':'角色','角色名稱':'角色','概要':'摘要','內容摘要':'摘要','事件摘要':'摘要','事件內容':'摘要','場所':'地點','地方':'地點','發生地點':'地點','重要性':'重要度','重要程度':'重要度','伏筆名稱':'名稱','說話人':'說話者','發言者':'說話者','說話對象':'對象','台詞內容':'台詞','原句':'台詞','對白':'台詞','理由':'原因','分類':'類別','狀態變化':'變化','變化內容':'變化','涉及角色':'相關角色','相關人員':'相關角色'};
function cleanLine(l){
  l=String(l).replace(/\u3000/g,' ').replace(/\*\*|__|`/g,'');
  l=l.replace(/^\s*>+\s*/,'').replace(/^\s*#{1,6}\s+/,'').replace(/^\s*(?:[-*+]\s+|[・•●○◆◇▪■□]\s*|\d{1,2}\s*[.)、．]\s*|[（(]\d{1,2}[）)]\s*)/,'');
  return l.trim();
}
function fieldsOf(body,keysOut){
  const o=Object.create(null);let last=null;
  body.split(/\r?\n/).forEach(raw=>{
    const l=cleanLine(raw);
    if(!l){last=null;return}
    if(/^[（(].*[）)]$/.test(l))return;
    const m=l.match(/^([^：:\s（(「『"“]{1,8})\s*(?:[（(][^）)]{0,30}[）)])?\s*[：:]\s*(.*)$/);
    if(m){const key=FIELD_ALIAS[m[1]]||m[1];if(keysOut)keysOut.push(m[1]);if(!o[key])o[key]=m[2].trim();last=key;return}
    if(last)o[last]=o[last]?o[last]+l:l;
  });
  return o;
}
function impOf(s){s=String(s||'');return s.includes('高')?'h':s.includes('低')?'l':'m'}
function statusOf(s){s=String(s||'');return (s.includes('回收')||s.includes('收尾')||s.includes('解決'))?'resolved':(s.includes('推進')||s.includes('發展'))?'developing':'planted'}
function parseOutput(txt,mode){
  const out={mode,events:[],foreshadows:[],states:[],quotes:[],errors:[]};
  const re=/【\s*([^】]+?)\s*】/g;let m;const heads=[];
  while((m=re.exec(txt)))heads.push({type:m[1],idx:m.index,start:re.lastIndex});
  if(!heads.length){out.fatal='找不到任何【區塊】標記，所以沒有讀出內容。請確認貼上的是 LLM 的整理結果，且每個區塊以【事件】【伏筆】這類標記開頭。若 LLM 改用了其他標題格式，請把指令重新貼給它，請它依格式重新輸出。';return out}
  const keys=[];
  let prevY=curY();
  const readTime=(raw,label)=>{
    let date=null,period=raw;const plus=raw.match(/[+＋]\s*(\d+)\s*天/);
    if(plus&&mode==='seg'){date=addDays(S.cur,+plus[1]);period=raw.replace(plus[0],'')}
    else{const p=parseDate(raw,prevY);if(p){date=p.date;period=p.rest}}
    if(!date){
      if(S.undated){out.errors.push(`${label}的時間無法辨識，請在下方填寫日期。`);return {date:null,period:clean(period)}}
      date={...S.cur};out.errors.push(`${label}的時間無法辨識，暫定為${fmt(date)}，請校正。`)}
    else if(!valid(date))out.errors.push(`${label}的日期「${fmt(date)}」在目前曆法中不存在，請校正。`);
    prevY=date.y;return {date,period:clean(period)};
  };
  heads.forEach((h,i)=>{
    const body=txt.slice(h.start,i+1<heads.length?heads[i+1].idx:txt.length);const f=fieldsOf(body,keys);const t=h.type;
    if(t.includes('事件')&&!f['摘要'])f['摘要']=f['內容']||f['描述']||'';
    if((t.includes('戲劇要素')||t.includes('伏筆')||t.includes('懸念')||t.includes('衝突'))&&!f['內容'])f['內容']=f['描述']||f['摘要']||'';
    if(t.includes('事件')){
      if(!f['摘要']){out.errors.push(`第 ${out.events.length+1} 個事件缺少「摘要」，已略過。`);return}
      const tm=readTime(f['時間']||'',`事件「${f['摘要'].slice(0,12)}…」`);
      out.events.push({dateText:fmt(tm.date),period:tm.period,place:f['地點']||'',chars:(f['角色']||'').trim(),summary:f['摘要'],imp:impOf(f['重要度'])});
    }else if(t.includes('戲劇要素')||t.includes('伏筆')||t.includes('懸念')||t.includes('衝突')){
      const kind=(f['類型']||'').includes('衝突')||(!f['類型']&&t.includes('衝突'))?'conflict':'foreshadow';
      const name=(f['名稱']||(f['內容']||'').slice(0,14)).trim();
      if(!name){out.errors.push('有一個戲劇要素缺少名稱與內容，已略過。');return}
      out.foreshadows.push({name,kind,status:statusOf(f['狀態']),content:f['內容']||'',chars:f['相關角色']||''});
    }else if(t.includes('台詞')||t.includes('對白')){
      const text=String(f['台詞']||'').replace(/^[「『"“]+|[」』"”]+$/g,'').trim();
      if(!text){out.errors.push('有一句台詞缺少內容，已略過。');return}
      const tm=readTime(f['時間']||'',`台詞「${text.slice(0,10)}…」`);
      out.quotes.push({dateText:fmt(tm.date),period:tm.period,speaker:f['說話者']||'',to:f['對象']||'',text,type:QT.find(x=>(f['類型']||'').includes(x))||'其他',why:f['原因']||''});
    }else if(t.includes('角色')){
      if(!f['角色']||!f['變化']){out.errors.push('有一筆角色狀態缺少角色或變化，已略過。');return}
      const cat=CATS.find(c=>(f['類別']||'').includes(c))||'心境';
      let target=f['對象']||'';if(/^僅|^無$|^－$|^-$/.test(target))target='';
      let act=f['動作']||'';if(/^僅|^無$|^－$|^-$/.test(act))act='';
      act=act.includes('失')||act.includes('交出')||act.includes('遺')?'失去':act.includes('得知')?'得知':act.includes('取')||act.includes('獲')?'取得':'';
      let subjects=f['當事人']||'';if(/^僅|^無$|^－$|^-$/.test(subjects))subjects='';
      let sid='';if(cat==='知情'){const ex=S.secrets.find(x=>x.text===(target||f['變化']).trim());sid=ex?ex.id:'new'}
      out.states.push({char:f['角色'],cat,target,act,change:f['變化'],subjects,sid});
    }
  });
  const total=out.events.length+out.foreshadows.length+out.states.length+out.quotes.length;
  if(!total){const uniq=[...new Set(keys)].slice(0,12);out.fatal=`找到 ${heads.length} 個【區塊】，但沒有讀出任何內容。${uniq.length?`工具讀到的欄位名稱是：${uniq.join('、')}。`:'區塊中找不到「欄位：內容」格式的文字。'}請確認欄位名稱與指令相同（例如「時間」「角色」「摘要」），或把指令重新貼給 LLM，請它依格式重新輸出。`}
  return out;
}
function commitParsed(){
  const p=ui.parsed;const pro=p.mode==='pro';const n=pro?0:curSeg()+1;
  let ord=maxOrder();const dates=[];let prevY=curY();
  p.events.forEach(e=>{
    const pd=parseDate(e.dateText,prevY);const date=pd?pd.date:{...S.cur};prevY=date.y;dates.push(date);
    const chars=splitNames(e.chars);chars.forEach(c=>ensureChar(c));
    S.events.push({id:uid(),seg:n,date,period:e.period,place:e.place,chars,summary:e.summary,imp:e.imp,src:pro?'pro':'llm',order:++ord});
  });
  p.quotes.forEach(q=>{const pd=parseDate(q.dateText,prevY);const date=pd?pd.date:{...S.cur};prevY=date.y;dates.push(date);[q.speaker,q.to].forEach(x=>splitNames(x).forEach(y=>ensureChar(y)));S.quotes.push({id:uid(),seg:n,date,period:q.period,speaker:q.speaker.trim(),to:q.to.trim(),text:q.text,type:q.type,why:q.why,done:false,order:++ord})});
  const sorted=dates.slice().sort((a,b)=>sortKey(a)-sortKey(b));
  const first=sorted[0],last=sorted[sorted.length-1];
  let endDate;
  if(pro){endDate=last?toExact(last):{...S.cur};if(last&&(S.undated||idx(endDate)>idx(S.cur))){if(S.undated)setFirstDate(endDate);else S.cur=endDate}}
  else{endDate=last&&idx(last)>idx(S.cur)?toExact(last):{...S.cur}}
  const stateDate=pro?endDate:endDate;
  p.foreshadows.forEach(f=>{
    const ex=S.foreshadows.find(x=>x.name.trim()===f.name.trim());const chars=splitNames(f.chars);
    if(ex){ex.status=f.status;ex.kind=f.kind||ex.kind;if(f.content)ex.content=f.content;ex.lastSeg=Math.max(ex.lastSeg,n);chars.forEach(c=>{if(!ex.chars.includes(c))ex.chars.push(c)})}
    else S.foreshadows.push({id:uid(),name:f.name,content:f.content,status:f.status,kind:f.kind||'foreshadow',chars,plantedSeg:n,lastSeg:n});
  });
  p.states.forEach(s=>{const c=ensureChar(s.char);if(c)applyState(c,{cat:s.cat,target:s.target,act:s.act,change:s.change,subjects:s.subjects,sid:s.sid},stateDate,n)});
  if(pro){
    let seg=S.segments.find(s=>s.n===0);
    if(!seg){seg={id:uid(),n:0,startDate:first||{...S.cur},endDate:last||{...S.cur}};S.segments.unshift(seg)}
    else{if(first&&sortKey(first)<sortKey(seg.startDate))seg.startDate=first;if(last&&sortKey(last)>sortKey(seg.endDate))seg.endDate=last}
  }else{
    S.segments.push({id:uid(),n,startDate:{...S.cur},endDate});S.cur=endDate;
  }
  recalcSegments();
  ui.parsed=null;ui.pasteText='';ui.justCommitted={n,label:segLabel(n)};
  save();render();window.scrollTo(0,0);
}

  const lb=storyBackupTime(S);const days=lb?Math.floor((Date.now()-new Date(lb))/86400000):null;

  return `<div class="notice">${days===null?'這個故事還沒有備份過。':`這個故事距離上次備份已經 ${days} 天。`}手機瀏覽器可能清除網站資料，建議定期匯出。<div class="row"><button class="btn sm" data-act="exportData" data-scope="story">匯出這個故事</button></div></div>`;
}
function stateHint(s){
  const c=S.characters.find(x=>x.name===String(s.char).trim());if(!c)return '新角色，將自動建立';const L=c.cur;
  if(SINGLE.includes(s.cat))return `目前：${L.single[s.cat]?L.single[s.cat].v:'（無）'}`;
  if(s.cat==='關係')return `目前對${s.target||'？'}：${L.rel[s.target]?L.rel[s.target].v:'（無）'}`;
  if(s.cat==='持有物'){const lose=isLose(s.act,s.change);const nm=lose?stripLose(s.change):stripGain(s.change);const now=L.items['持有物'].map(x=>x.v).join('、')||'（無）';return `${lose?'－':'＋'}${nm}　目前持有：${now}${lose&&!findItem(L.items['持有物'],nm)?'（找不到這項，將只記入歷程）':''}`}
  const ex=s.sid&&s.sid!=='new'&&secretById(s.sid);
  return ex?`歸入既有秘密「${ex.text}」`:`＋新秘密「${s.target||s.change}」`;
}

function showSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;const f=$('#sheetBody').querySelector('input:not([data-nofocus]),textarea');if(f)setTimeout(()=>f.focus(),60)}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML='';formCb=confirmCb=formExtraCb=null}

function openForm(title,fields,vals,cb,note,extra){

    const v=vals[f.k]??'';let inp;
    if(f.t==='textarea')inp=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if(f.t==='select')inp=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else inp=`<input name="${f.k}" type="text" value="${esc(v)}">`;
    return `<label class="fld"><span>${esc(f.l)}</span>${inp}</label>`;
  }).join('')+`<div class="row">${extra?`<button class="btn danger" data-act="formExtra">${esc(extra.label)}</button>`:''}<span style="flex:1"></span><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn primary" data-act="saveForm">儲存</button></div>`);
}
function askConfirm(msg,yes,label){confirmCb=yes;showSheet(`<h3>${esc(msg)}</h3><div class="row end"><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn danger" data-act="confirmYes">${esc(label||'確定')}</button></div>`)}
function readDate(text,fallbackY){const p=parseDate(text,fallbackY||curY());if(!p){toast('無法辨識日期，請用「1892年3月5日」這類格式');return null}if(!valid(p.date)){toast(`「${fmt(p.date)}」在目前曆法中不存在`);return null}return p}
function qFields(){return [...qFieldsBase,{k:'seg',l:'所屬段落',t:'select',o:segOptions()}]}
const qFieldsBase=[{k:'date',l:'日期'},{k:'period',l:'時段'},{k:'speaker',l:'說話者'},{k:'to',l:'對象'},{k:'text',l:'台詞（原句）',t:'textarea'},{k:'type',l:'類型',t:'select',o:QT.map(x=>[x,x])},{k:'why',l:'為何重要'}];
function saveQuote(q,o){
  const p=readDate(o.date);if(!p)return false;
  if(!o.text.trim()){toast('請填寫台詞');return false}
  [o.speaker,o.to].forEach(n=>splitNames(n).forEach(x=>ensureChar(x)));
  const sg=Math.max(0,parseInt(o.seg));if(!isNaN(sg)){ensureSeg(sg);q.seg=sg}
  Object.assign(q,{date:p.date,period:o.period.trim(),speaker:o.speaker.trim(),to:o.to.trim(),text:o.text.trim().replace(/^[「『"“]+|[」』"”]+$/g,''),type:o.type,why:o.why.trim()});
  recalcSegments();
}
function newQuoteForm(prefill){
  openForm('新增關鍵台詞',qFields(),Object.assign({date:curText(),type:'其他',seg:String(curSeg())},prefill||{}),o=>{
    const q={id:uid(),seg:curSeg(),done:false,order:maxOrder()+1};
    if(saveQuote(q,o)===false)return false;S.quotes.push(q);recalcSegments();toast('已新增台詞');
  });
}
const modeField={k:'mode',l:'這次修改是',t:'select',o:[['change','劇情中的變化（舊值移入歷程）'],['fix','修正記錄錯誤（不留歷程）']]};
const dateField={k:'date',l:'變化日期（劇情變化時使用）'};
function evFields(){return [...evFieldsBase,{k:'seg',l:'所屬段落',t:'select',o:segOptions()}]}
const evFieldsBase=[{k:'date',l:'日期（如 1892年3月5日，只知道年月也可以）'},{k:'period',l:'時段'},{k:'place',l:'地點'},{k:'chars',l:'角色（以頓號分隔）'},{k:'summary',l:'摘要',t:'textarea'},{k:'imp',l:'重要度',t:'select',o:[['h','高'],['m','中'],['l','低']]}];
const fsFields=[{k:'name',l:'名稱'},{k:'kind',l:'類型',t:'select',o:Object.entries(FKIND)},{k:'content',l:'內容',t:'textarea'},{k:'status',l:'狀態',t:'select',o:Object.entries(FSN)},{k:'chars',l:'相關角色（以頓號分隔）'}];
const cfFields=[{k:'content',l:'內容',t:'textarea'},{k:'chars',l:'相關角色（以頓號分隔）'}];
function saveEvent(e,o){
  const p=readDate(o.date);if(!p)return false;
  if(!o.summary.trim()){toast('請填寫摘要');return false}
  const chars=splitNames(o.chars);chars.forEach(c=>ensureChar(c));
  const sg=Math.max(0,parseInt(o.seg));if(!isNaN(sg)){ensureSeg(sg);e.seg=sg}
  Object.assign(e,{date:p.date,period:o.period.trim(),place:o.place.trim(),chars,summary:o.summary.trim(),imp:o.imp});
  recalcSegments();
}
function recalcSegments(){
  S.segments.forEach(g=>{
    const ds=[...S.events,...S.quotes].filter(x=>x.seg===g.n).map(x=>x.date).sort((a,b)=>sortKey(a)-sortKey(b));
    if(ds.length){g.startDate={...ds[0]};g.endDate={...ds[ds.length-1]}}
  });
}
function segOptions(){
  const ns=new Set(S.segments.map(g=>g.n));ns.add(0);if(curSeg()>0)ns.add(curSeg());
  return [...ns].sort((a,b)=>a-b).map(n=>[String(n),segLabel(n)]);
}
function ensureSeg(n){if(!S.segments.some(g=>g.n===n))S.segments.push({id:uid(),n,startDate:{...S.cur},endDate:{...S.cur}});S.segments.sort((a,b)=>a.n-b.n)}
function segMismatch(x){
  const k=sortKey(x.date);const others=[...S.events,...S.quotes].filter(y=>y!==x&&y.id!==x.id);
  const before=others.filter(y=>y.seg<x.seg),after=others.filter(y=>y.seg>x.seg);
  return before.some(y=>sortKey(y.date)>k)||after.some(y=>sortKey(y.date)<k);
}
function newEventForm(prefill){
  openForm('新增事件',evFields(),Object.assign({date:curText(),imp:'m',seg:String(curSeg())},prefill||{}),o=>{
    const e={id:uid(),seg:curSeg(),src:'manual',order:maxOrder()+1};
    if(saveEvent(e,o)===false)return false;S.events.push(e);recalcSegments();toast('已新增事件');
  });
}
function newFsForm(prefill){
  openForm('新增戲劇要素',fsFields,Object.assign({status:'planted',kind:'foreshadow'},prefill||{}),o=>{
    if(!o.name.trim()){toast('請填寫名稱');return false}
    S.foreshadows.push({id:uid(),name:o.name.trim(),content:o.content.trim(),status:o.status,kind:o.kind,chars:splitNames(o.chars),plantedSeg:curSeg(),lastSeg:curSeg()});toast('已新增戲劇要素');
  });
}

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
const safeName=n=>String(n||'').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,30)||'未命名';
function markBackup(ids){const now=new Date().toISOString();(ids||[]).forEach(id=>{if(DB.stories[id])DB.stories[id].lastBackup=now});if((ids||[]).length===Object.keys(DB.stories).length)DB.lastBackup=now;ui.justCommitted=null;save();render()}

  return {json:JSON.stringify({v:2,ready:true,active:S.id,stories:{[S.id]:S},settings:DB.settings,lastBackup:null,updatedAt:DB.updatedAt,exportedAt:now,scope:'story'}),name:`${safeName(S.name)}_${stamp()}.json`,ids:[S.id]};
}
let pendingImport=null;
function importJson(text){
  let raw;try{raw=JSON.parse(text)}catch(e){toast('無法讀取：內容不是有效的備份格式');return}
  let d=null;try{d=cleanDB(raw)}catch(e){d=null}

    if(ex){older=!!(st.updatedAt&&ex.updatedAt&&new Date(st.updatedAt)<new Date(ex.updatedAt));note=`將覆蓋目前的「${ex.name}」`+(st.updatedAt&&ex.updatedAt?(older?'（備份較舊）':'（備份較新）'):'')}
    return `<label class="check improw"><input type="checkbox" name="imp" value="${esc(id)}" ${older?'':'checked'}><span><b>${esc(st.name||'未命名故事')}</b><div class="small">${esc(note)}　${cArr(st.events).length} 個事件</div></span></label>`;
  }).join('');
  showSheet(`<h3>匯入備份</h3><p class="hint">勾選要匯入的故事。沒有勾選的、以及備份裡沒有的故事都會保留，不受影響。</p>${rows}

}

    const scope=d&&d.scope==='all'?'all':'story';const {json,name,ids}=exportPayload(scope);
    try{const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup(ids);toast(scope==='all'?'已匯出全部故事':'已匯出這個故事');return}
    }catch(e){if(e&&e.name==='AbortError')return}
    ui.exportText=json;ui.exportIds=ids;ui.exportScope=scope;ui.tab='settings';render();toast('請複製備份內容另存');
  },
  copyExport:async()=>{if(await copy(ui.exportText,'已複製備份內容'))markBackup(ui.exportIds)},
  pickFile:()=>$('#fileIn').click(),
  copyRaw:()=>{let r='';try{r=localStorage.getItem(KEY)||localStorage.getItem(KEY+'-unreadable')||''}catch(e){}if(!r){toast('沒有可複製的資料');return}copy(r,'已複製原始資料，請貼到記事本保存')},
  importPaste:()=>{if(!ui.importText.trim()){toast('請先貼上備份內容');return}importJson(ui.importText)},
  resetTemplate:d=>{DB.settings[d.k]=d.k==='template'?DEFAULT_TEMPLATE:DEFAULT_PRO;save();render();toast('已還原預設指令')},
  clearAll:()=>askConfirm('清空所有故事與資料？此動作無法復原。',()=>{DB=firstDB();S=DB.stories[DB.active];resetUi();ui.tab='work';save();render()},'清空')
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui!==undefined)ui[t.dataset.ui]=t.value;
  else if(t.dataset.p){const [k,i,f]=t.dataset.p.split('.');ui.parsed[k][+i][f]=t.value}
  else if(t.dataset.st){S[t.dataset.st]=t.value;save();$('#storyName').textContent=S.name||'未命名故事'}
  else if(t.dataset.cal){
    const months=t.value.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const m=l.match(/^(.*?)\s*(\d+)\s*$/);if(!m)return null;const nm=m[1].trim();return {name:/^\d+月$/.test(nm)?'':nm,days:Math.min(1000,Math.max(1,+m[2]))}}).filter(Boolean);
    if(months.length){S.cal.months=months;save()}
  }
  else if(t.dataset.set){
    const k=t.dataset.set;
    if(k==='template'||k==='proTemplate')DB.settings[k]=t.value;
    else if(k==='questions')DB.settings.questions=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(k==='cards'){const o={};t.value.split('\n').forEach(l=>{const m=l.match(/^\s*([^：:]+)[：:]\s*(.+)$/);if(m)(o[m[1].trim()]=o[m[1].trim()]||[]).push(m[2].trim())});DB.settings.cards=o}
    save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='revN'){const n=Math.min(500,Math.max(1,parseInt(t.value,10)||20));DB.settings.reviewN=n;t.value=n;save();const pv=$('pre.prev');if(pv&&ui.showPrompt)pv.textContent=fillPrompt();return}
  if(t.dataset.uichk){ui[t.dataset.uichk]=t.checked}
  else if(t.dataset.uic){ui[t.dataset.uic]=t.value;render()}
  else if(t.dataset.story){switchStory(t.value)}
  else if(t.dataset.cal){render()}
  else if(t.dataset.stdate){const p=readDate(t.value);if(!p||p.date.prec!=='d'){if(p)toast('請填寫完整的年月日');t.value=S.undated?'':fmt(S[t.dataset.stdate]);return}if(S.undated)setFirstDate(p.date);else S[t.dataset.stdate]=p.date;save();render();toast('已更新日期')}
  else if(t.dataset.fsstatus){const f=S.foreshadows.find(x=>x.id===t.dataset.fsstatus);f.status=t.value;f.lastSeg=Math.max(f.lastSeg,curSeg());save();render();toast(`已改為「${FSN[t.value]}」`)}
  else if(t.dataset.chartype){const c=S.characters.find(x=>x.id===t.dataset.chartype);if(c&&CTYPE[t.value]){c.type=t.value;if(!c.profile)c.profile={};save();render();toast(`已改為${CTYPE[t.value]}`)}}
});
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=checkbox]),textarea,select'))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>document.body.classList.remove('typing'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function boot(){
  try{migrateAll();render()}
  catch(e){
    console.error(e);
    $('#main').innerHTML=`<section class="sec"><h2>資料讀取失敗</h2><p class="hint">儲存的資料格式有問題，App 無法正常顯示。請先複製原始資料保存，再選擇重設；也可以重設後用正常的備份檔匯入。</p><div class="row"><button class="btn primary" data-act="copyRaw">複製原始資料</button><button class="btn danger" data-act="clearAll">重設</button></div></section>`;
  }
}
boot();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});


</script>
<script>
(()=>{let last=window.scrollY,ticking=false;
  const upd=()=>{ticking=false;const y=window.scrollY,b=document.body;
    const atEnd=y+innerHeight>=document.documentElement.scrollHeight-4;
    if(y<=60||atEnd)b.classList.remove('navhide');
    else if(y>last+6)b.classList.add('navhide');
    else if(y<last-6)b.classList.remove('navhide');
    if(Math.abs(y-last)>6||y<=60)last=y};
  addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(upd)}},{passive:true});
})();
</script>
</body>
</html>
