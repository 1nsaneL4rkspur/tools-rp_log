<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yarn Trifle - 敘線鬆糕">
<title>Yarn Trifle - 敘線鬆糕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<style>
:root{
  --bg:#E8E8E5;
  --surface:#F4F4F1;
  --ink:#111214;
  --mute:#6B6D70;
  --line:#CBCBC7;
  --line2:#8E908B;
  --accent:#1F3BFF;
  --accent-ink:#FFFFFF;
  --accent-soft:#DDE2FF;
  --grid:rgba(17,18,20,.055);
  --stripe:rgba(17,18,20,.2);
  --sans:"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Source Han Sans TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --disp:"Space Grotesk",var(--sans);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
/* 頁首 */
.seal small{font-size:.66rem;font-weight:600}
/* 分區 */
.sec:last-child{border-bottom:0}
.btn.big{width:100%;min-height:52px;font-size:1.02rem}
.btn.sm{min-height:40px;padding:5px 11px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row > .grow{flex:1}
textarea{resize:vertical;min-height:110px;line-height:1.55}
.notice .row{margin-top:8px}
.ok{background:var(--accent-soft);border-left-color:var(--accent)}
/* 分段切換 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* 解析預覽 */
.pitem .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pitem .g > label:first-child{grid-column:1 / -1}
.pitem .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pitem textarea{min-height:60px;margin-top:6px}
.pitem .k{font-size:.75rem;color:var(--mute);display:block;margin-bottom:2px}
.pitem .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.82rem;color:var(--mute)}
/* 時間軸 */
.filters select{padding:8px 8px;font-size:16px}
.ev-btn{all:unset;display:block;width:100%;cursor:pointer}
.ev .chips{margin-top:6px}
/* 列表項目 */
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .desc{margin-top:2px}
.item .meta{font-size:.8rem;color:var(--mute);margin-top:4px}
.item .row{margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.done .desc{text-decoration:line-through;color:var(--mute)}
ol.qs{margin:10px 0 0;padding-left:1.4em}
ol.qs li{margin:6px 0}
/* 角色 */
.char{border-bottom:1px solid var(--line)}
.char-btn{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;cursor:pointer}
.char-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.char-btn .info{flex:1;min-width:0}
.char-btn .info b{display:block}
.char-btn .info :where(span){font-size:.82rem;color:var(--mute)}
.chev{color:var(--mute);transition:transform .15s}
.char.open .chev{transform:rotate(90deg)}
.cdetail{padding:0 0 16px 52px}
.stt dt{color:var(--mute)}
.stt dd{margin:0}
.stt dd small{color:var(--mute)}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:.85rem}
.hist li .t{flex:1}
.hist li .d{color:var(--mute);flex:none;font-size:.78rem;padding-top:2px}
.secret{padding:14px 0;border-bottom:1px solid var(--line)}
.secret .name{font-weight:700}
.secret .knows{font-size:.85rem;margin-top:6px}
.secret .knows :where(span){color:var(--mute);margin-right:6px}
/* 分頁列 */
.tabbar-in{max-width:680px;margin:0 auto;display:flex}
@media (min-width:720px){
  .fab{right:calc(50% - 340px + 18px)}
}
@media (max-width:760px){
  body.typing .tabbar,body.typing .fab{display:none}
}
/* 底部面板 */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
}
.fld{display:block;margin-bottom:12px}
.fld > span{display:block;font-size:.82rem;color:var(--mute);margin-bottom:4px}
.toast.show{opacity:1}
.small{font-size:.82rem;color:var(--mute)}
/* 其他 */
.modebar{margin-top:16px}
.prof dt{color:var(--mute)}
.prof dd{margin:0}
body.setup .tabbar,body.setup .fab,body.setup .seal{display:none}
.fv{all:unset;cursor:pointer;line-height:1.5}
.fv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stt dd .chips{gap:8px}
.stt{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:.9rem;row-gap:8px}
details.fold summary{cursor:pointer;font-size:.88rem;color:var(--mute);padding:6px 0;list-style-position:inside}
.sec-btn{all:unset;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer}
.sec-btn .name{flex:1}
.sec-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
button.chip.subj{font-size:.85rem}
.chip.ck{display:inline-flex;align-items:center;gap:6px;min-height:38px;cursor:pointer}
.chip.ck input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.fld > .chips{margin-top:2px}
.grp-btn{all:unset;display:block;width:100%;cursor:pointer}
.grp-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.seal.undated{border-style:dashed;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* ===== 框架層 ===== */
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;overflow-x:clip}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0E0F11;
    --surface:#17181B;
    --ink:#ECECE8;
    --mute:#8B8D91;
    --line:#2B2D31;
    --line2:#55585E;
    --accent:#4A68FF;
    --accent-soft:#151B3D;
    --grid:rgba(236,236,232,.045);
    --stripe:rgba(236,236,232,.24);
  }
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 頁首：日期被底線裁切的大數字 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ink);overflow:hidden}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:flex-end;padding:14px 18px 0;gap:18px}
.story{flex:1;min-width:0;padding-bottom:12px}
.story h1{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans);font-weight:900;font-size:1.12rem;letter-spacing:.02em}
.story p{margin:0;color:var(--mute);font-family:var(--disp);font-size:.78rem;letter-spacing:.01em}
.story p.sub{display:flex;align-items:center;gap:8px;min-width:0}
#storySub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help-btn{appearance:none;flex:none;position:relative;width:18px;height:18px;padding:0;border:1px solid currentColor;border-radius:50%;background:transparent;color:var(--mute);font-family:var(--disp);font-size:.72rem;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.help-btn::after{content:"";position:absolute;inset:-13px}
.help-btn:active{color:var(--ink)}
.help .pg{font-family:var(--disp);font-size:.76rem;color:var(--mute);margin:0 0 6px}
.help h4{margin:20px 0 8px;font-size:1rem;font-weight:900}
.help p,.help li{font-size:.95rem;line-height:1.7}
.help p{margin:0 0 10px}
.help ol,.help ul{margin:0 0 10px;padding-left:1.4em}
.help li{margin:4px 0}
.help .tip{font-size:.86rem;color:var(--mute);border-left:3px solid var(--accent);padding-left:10px}
.seal{flex:none;display:flex;justify-content:center;width:auto;height:auto;border:0;border-radius:0;background:none;transform:none;color:var(--ink);flex-direction:row;align-items:flex-start;gap:6px;font-family:var(--disp);line-height:1}
.seal small.mn{font-family:var(--sans);font-size:.72rem;font-weight:500;color:var(--mute);padding-top:.35rem}
.seal b{font-family:var(--disp);font-weight:300;font-size:3.6rem;line-height:.8;letter-spacing:-.04em;margin:0 0 -.2em;font-variant-numeric:tabular-nums}
.seal #sealD{display:none}
.seal.undated b{margin-top:3px;font-family:var(--sans);font-weight:200;font-size:2.2rem;margin-bottom:-.12em}
/* 主欄：可見的系統網格 */
main{max-width:680px;margin:0 auto;padding:6px 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 78px);background:linear-gradient(to right,var(--grid) 1px,transparent 1px) 18px 0/calc((100% - 36px) / 4) 100% repeat-x}
/* 篩選與操作：完全秩序 */
.btn{appearance:none;border:1px solid var(--line);padding:9px 14px;font-size:.95rem;cursor:pointer;min-height:42px;border-radius:0;border-color:var(--line2);background:transparent}
.btn.primary{font-weight:700;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;padding-left:4px;padding-right:10px}
.btn:active{transform:none;background:var(--surface)}
.btn.primary:active{filter:brightness(.92);background:var(--accent)}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);padding:10px 12px;border-radius:0;border-color:var(--line2);background:var(--surface)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;margin:16px 0 0;gap:0;margin-top:20px}
.filters select + select{border-left:0}
.chip{border:1px solid var(--line);border-radius:0;background:transparent;border-color:var(--line2);font-size:.76rem;padding:1px 8px}
/* 月份分隔：極端字重對比＋斷裂細線 */
.mdiv{display:flex;font-weight:900;color:var(--ink);margin:52px 0 0;gap:8px;align-items:baseline;font-family:var(--disp);font-size:1.5rem;letter-spacing:-.01em;line-height:1.1}
.mdiv .y{font-weight:300;color:var(--mute)}
.mdiv .m{font-family:var(--sans);font-weight:900}
.mdiv::after{content:"";flex:1;height:1px;opacity:1;align-self:center;background:linear-gradient(to right,var(--ink) 0 58%,transparent 58% calc(58% + 18px),var(--ink) calc(58% + 18px))}
.row + .mdiv,.filters + .row + .mdiv{margin-top:36px}
/* 單日：日期數字 */
.day{margin-top:30px}
.dayhead{display:flex;gap:12px;margin-bottom:2px;align-items:flex-end}
.dseal{font-size:.85rem;font-weight:600;border:0;background:none;padding:0;border-radius:0;color:var(--ink);display:inline-flex;align-items:flex-start;gap:5px;font-family:var(--disp);line-height:1}
.dseal .dm{font-family:var(--sans);font-size:.72rem;font-weight:500;color:var(--mute);padding-top:.2rem}
.dseal b{font-size:2.1rem;font-weight:500;letter-spacing:-.03em;margin:0;font-variant-numeric:tabular-nums}
.dseal .dd{display:none}
.dseal.vague{border-style:dashed;background:transparent;border-color:var(--mute);font-family:var(--sans);font-size:.82rem;font-weight:500;color:var(--mute);border:1px dashed var(--line2);padding:3px 8px}
.dayhead .rule{flex:1;height:1px;background:var(--line);margin-bottom:.45rem}
.day[style] .dayhead .rule{height:11px;margin-bottom:calc(.45rem - 5px);background:linear-gradient(var(--accent),var(--accent)) calc(var(--p) * 100%) 0/2px 100% no-repeat, linear-gradient(var(--line2),var(--line2)) 0 50%/calc(var(--p) * 100%) 1px no-repeat, repeating-linear-gradient(to right,var(--line2) 0 2px,transparent 2px 6px) 0 50%/100% 1px no-repeat}
.dayhead .cnt{color:var(--mute);font-family:var(--disp);font-size:.76rem;margin-bottom:.2rem}
/* 事件軸：細線＋方形節點 */
.ev{position:relative;border-left:1px solid var(--line2);margin-left:10px;padding:12px 0 12px 20px}
.ev::before{content:"";position:absolute;left:-5px;top:20px;width:9px;height:9px;border-radius:0;background:var(--bg);border:1px solid var(--mute)}
.ev.m::before{border-color:var(--accent);border:1.5px solid var(--ink)}
.ev.h{border-left-color:var(--accent)}
.ev.h::before{background:var(--accent);border-color:var(--accent);width:11px;height:11px;left:-6px;top:19px}
.ev.h .sum{font-weight:500}
.ev.q::before{border-color:var(--accent);border-radius:0;background:var(--bg);border:1.5px solid var(--ink);transform:rotate(45deg)}
.ev-btn:focus-visible{outline-offset:3px;outline:2px solid var(--accent);border-radius:0}
.ev .sum{font-size:1rem;line-height:1.6}
.ev .meta{color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;font-size:.78rem;gap:4px 12px}
.ev .more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.qt{font-family:var(--sans);font-weight:300;font-size:1.06rem;line-height:1.7}
.qtype{color:var(--ink);font-weight:700}
.imp-tag{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 9px 0 6px;clip-path:polygon(0 0,100% 0,100% 55%,calc(100% - 6px) 100%,0 100%)}
.warn-tag{color:var(--ink);font-weight:500;padding:0 6px;background:repeating-linear-gradient(135deg,var(--stripe) 0 1px,transparent 1px 5px)}
.gap{color:var(--mute);margin:16px 0 0 10px;padding:8px 0 8px 20px;border-left:1px dashed var(--line2);font-family:var(--disp);font-size:.76rem}
.dayfold{display:block;margin:2px 0 0 30px;background:none;border:0;padding:8px 0;min-height:40px;font-size:.85rem;cursor:pointer;text-align:left;margin-left:30px;color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.dayfold:focus-visible{outline:2px solid var(--accent);outline-offset:2px;outline-color:var(--accent);border-radius:0}
/* 空狀態：幾何構成 */
.empty{color:var(--mute);text-align:center;font-size:.92rem;padding:44px 10px}
.empty::before{content:"";display:block;width:132px;height:88px;margin:0 auto 20px;background:linear-gradient(var(--accent),var(--accent)) 82px 18px/14px 14px no-repeat, linear-gradient(var(--ink),var(--ink)) 0 52px/100% 1px no-repeat, linear-gradient(var(--ink),var(--ink)) 36px 0/1px 100% no-repeat, linear-gradient(to top right,transparent calc(50% - .6px),var(--mute) 50%,transparent calc(50% + .6px)) 36px 0/96px 88px no-repeat}
/* 分頁列與浮動按鈕 */
.tab{flex:1;border:0;background:transparent;padding:10px 2px 12px;min-height:56px;font-size:.82rem;color:var(--mute);cursor:pointer;position:relative;font-weight:500}
.tab.on{color:var(--ink);font-weight:900}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;border-radius:0;background:var(--accent)}
body[data-tab="settings"] .fab,body.setup .fab{display:none}
.fab span{font-size:1.45rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;display:none}
.fab::before,.fab::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%)}
.fab::after{transform:translate(-50%,-50%) rotate(90deg)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--ink);transition:transform .22s ease}
.fab{position:fixed;z-index:31;color:#fff;font-family:var(--sans);font-weight:900;font-size:1.05rem;cursor:pointer;border-radius:0;background:var(--bg);border:1px solid var(--ink);box-shadow:none;width:44px;height:44px;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));transition:transform .22s ease,opacity .18s ease}
body.navhide .tabbar{transform:translateY(100%)}
body.navhide .fab{transform:translateY(140px);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .tabbar,.fab{transition:none}
}
/* ===== 操作層與元件 ===== */
/* 分區與步驟編號 */
.sec{border-bottom:1px solid var(--line);padding:30px 0 28px;position:relative}
.sec h2{margin:0 0 6px;display:flex;font-family:var(--sans);font-weight:900;font-size:1.08rem;align-items:baseline;gap:12px;margin-bottom:8px}
.stepn{flex:none;align-items:center;justify-content:center;width:auto;height:auto;border:0;border-radius:0;color:var(--ink);font-family:var(--disp);font-weight:300;font-size:2.2rem;line-height:.8;letter-spacing:-.04em;display:inline-block;font-variant-numeric:tabular-nums}
.sec.muted h2{color:var(--mute)}
.sec.muted .stepn{border-color:var(--line);color:var(--line2);border:0}
.hint{margin:0 0 12px;font-size:.88rem;color:var(--mute)}
#accentNote:empty{display:none}
h3.sub{margin:18px 0 8px;font-weight:900;font-size:.85rem;color:var(--ink);margin-top:24px;display:flex;align-items:center;gap:10px}
h3.sub::after{content:"";flex:1;height:1px;background:var(--line)}
pre.prev{white-space:pre-wrap;padding:12px;font-family:var(--sans);font-size:.85rem;max-height:260px;overflow:auto;margin:10px 0 0;border-radius:0;border:1px solid var(--line);background:var(--surface)}
/* 提示框 */
.notice{padding:12px 14px;margin:16px 0 0;font-size:.9rem;border-radius:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink)}
.notice.ok{background:var(--accent-soft);border-color:var(--accent-soft);border-left-color:var(--accent)}
.err{font-size:.85rem;margin:6px 0 0;color:var(--ink);font-weight:500;padding:2px 6px;background:repeating-linear-gradient(135deg,var(--stripe) 0 1px,transparent 1px 5px)}
/* 分段切換：與分頁列同一語彙 */
.seg{display:flex;margin:16px 0 4px;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:0;gap:0}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:.92rem;cursor:pointer;border-radius:0;color:var(--mute);font-weight:500;position:relative;min-height:44px}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:transparent;color:var(--ink);font-weight:900}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}
.seg button .n{font-size:.78rem;margin-left:3px;font-family:var(--disp);opacity:1;color:var(--mute);font-weight:400}
/* 標籤 */
button.chip{cursor:pointer;min-height:34px;padding:4px 12px;font-size:.86rem}
button.chip.on{font-weight:700;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip.add{background:transparent;border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip.subj{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.yes{border-color:var(--accent);color:var(--accent)}
.chip.no{color:var(--mute);border-style:dashed}
.chip.ck.ext{border-style:dashed}
.chip.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.stale{display:inline-block;font-size:.75rem;margin-left:6px;font-weight:500;vertical-align:2px;border:0;border-radius:0;color:var(--ink);padding:0 6px;background:repeating-linear-gradient(135deg,var(--stripe) 0 1px,transparent 1px 5px)}
.kindtag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid var(--accent);padding:0 6px;margin-right:6px;vertical-align:2px;border-radius:0;border-color:var(--ink);color:var(--ink)}
.kindtag.cf{border-color:var(--ink);background:var(--ink);color:var(--bg)}

const GD=[31,28,31,30,31,30,31,31,30,31,30,31];
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const custom=()=>S.cal.type==='custom'&&S.cal.months.length>0;
function mCount(){return custom()?S.cal.months.length:12}
function mDays(y,m){if(custom()){const mo=S.cal.months[m-1];return mo?mo.days:0}return m===2&&isLeap(y)?29:(GD[m-1]||0)}
function yLen(){return S.cal.months.reduce((a,b)=>a+(b.days||0),0)||365}
function daysBeforeYear(y){if(custom())return (y-1)*yLen();const p=y-1;return 365*p+Math.floor(p/4)-Math.floor(p/100)+Math.floor(p/400)}
function idx(dt){const m=dt.prec==='y'?1:dt.m,d=dt.prec==='d'?dt.d:1;let n=daysBeforeYear(dt.y);for(let i=1;i<m;i++)n+=mDays(dt.y,i);return n+d}
function fromIdx(n){
  let y=Math.floor((n-1)/(custom()?yLen():365.2425))+1;
  while(daysBeforeYear(y)>=n)y--;while(daysBeforeYear(y+1)<n)y++;
  let r=n-daysBeforeYear(y),m=1;while(m<mCount()&&r>mDays(y,m)){r-=mDays(y,m);m++}
  return D(y,m,r);
}
const addDays=(dt,n)=>fromIdx(idx(dt)+n);
const toExact=dt=>dt.prec==='d'?{...dt}:fromIdx(idx(dt));
function sortKey(dt){return idx(dt)-(dt.prec==='d'?0:dt.prec==='m'?0.5:0.6)}
function valid(dt){if(!dt)return false;if(dt.prec==='y')return true;if(dt.m<1||dt.m>mCount())return false;if(dt.prec==='m')return true;return dt.d>=1&&dt.d<=mDays(dt.y,dt.m)}
function monthName(m){return (custom()&&S.cal.months[m-1]&&S.cal.months[m-1].name)||`${m}月`}
function fmt(dt){if(!dt)return'';if(dt.prec==='y')return `${dt.y}年`;if(dt.prec==='m')return `${dt.y}年${monthName(dt.m)}`;return `${dt.y}年${monthName(dt.m)}${dt.d}日`}
function storyDay(){return idx(S.cur)-idx(S.start)+1}
const curY=()=>S.undated?null:S.cur.y;
const curText=()=>S.undated?'':fmt(S.cur);
function setFirstDate(dt){S.start={...dt};S.cur={...dt};S.undated=false}
function parseDate(str,prevY){
  str=String(str||'').trim();let m;
  const names=custom()?S.cal.months.map(x=>x.name).filter(Boolean):[];
  if(names.length){
    const re=new RegExp('(?:(\\d+)\\s*年)?\\s*('+names.map(escRe).join('|')+')\\s*(?:(\\d+)\\s*日)?');
    m=str.match(re);
    if(m&&(m[1]||prevY)){const mi=S.cal.months.findIndex(x=>x.name===m[2])+1,y=m[1]?+m[1]:prevY;return {date:m[3]?D(y,mi,+m[3]):Dm(y,mi),rest:str.replace(m[0],'')}}
  }
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d{1,5})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月/)))return {date:Dm(+m[1],+m[2]),rest:str.replace(m[0],'')};
  if(prevY&&(m=str.match(/(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(prevY,+m[1],+m[2]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年/)))return {date:Dy(+m[1]),rest:str.replace(m[0],'')};
  return null;
}

  const cell=(i,k)=>{const x=(i%2)*20,y=(i>>1)*20,r=(h>>>(8+i*2))&3;
    switch(k){
      case 1:return `<rect x="${x}" y="${y}" width="20" height="20"/>`;
      case 2:{const cx=x+(r&1?20:0),cy=y+(r&2?20:0),sx=r&1?-1:1,sy=r&2?-1:1;return `<path d="M${cx} ${cy}h${20*sx}a20 20 0 0 ${sx*sy>0?1:0} ${-20*sx} ${20*sy}z"/>`}
      case 3:return r&1?`<path d="M${x} ${y}h20v20z"/>`:`<path d="M${x} ${y+20}h20v-20z"/>`;
      case 4:return `<rect x="${x}" y="${y+(r&1?10:0)}" width="20" height="10"/>`;
      case 5:return `<circle cx="${x+10}" cy="${y+10}" r="7"/>`;
      default:return '';
    }};
  const MAP=[0,2,3,1,2,5,0,4];let sq=0;for(let i=0;i<4;i++){let k=MAP[(h>>>(i*3))&7];if(k===1&&sq++)k=2;if(i===3&&used<2&&!k)k=2+(h%4);if(k)used++;out+=cell(i,k)}

function applyState(c,st,date,seg){
  const cat=st.cat,h={id:uid(),cat,date:{...date},seg};

function isEmptyStory(st){

/* ---------- parser ---------- */
const FIELD_ALIAS={'日期':'時間','時間點':'時間','發生時間':'時間','故事時間':'時間','人物':'角色','登場角色':'角色','登場人物':'角色','相關人物':'角色','角色名':'角色','角色名稱':'角色','概要':'摘要','內容摘要':'摘要','事件摘要':'摘要','事件內容':'摘要','場所':'地點','地方':'地點','發生地點':'地點','重要性':'重要度','重要程度':'重要度','伏筆名稱':'名稱','說話人':'說話者','發言者':'說話者','說話對象':'對象','台詞內容':'台詞','原句':'台詞','對白':'台詞','理由':'原因','分類':'類別','狀態變化':'變化','變化內容':'變化','涉及角色':'相關角色','相關人員':'相關角色'};
function cleanLine(l){
  l=String(l).replace(/\u3000/g,' ').replace(/\*\*|__|`/g,'');
  l=l.replace(/^\s*>+\s*/,'').replace(/^\s*#{1,6}\s+/,'').replace(/^\s*(?:[-*+]\s+|[・•●○◆◇▪■□]\s*|\d{1,2}\s*[.)、．]\s*|[（(]\d{1,2}[）)]\s*)/,'');
  return l.trim();
}
function fieldsOf(body,keysOut){
  const o=Object.create(null);let last=null;
  body.split(/\r?\n/).forEach(raw=>{
    const l=cleanLine(raw);
    if(!l){last=null;return}
    if(/^[（(].*[）)]$/.test(l))return;
    const m=l.match(/^([^：:\s（(「『"“]{1,8})\s*(?:[（(][^）)]{0,30}[）)])?\s*[：:]\s*(.*)$/);
    if(m){const key=FIELD_ALIAS[m[1]]||m[1];if(keysOut)keysOut.push(m[1]);if(!o[key])o[key]=m[2].trim();last=key;return}
    if(last)o[last]=o[last]?o[last]+l:l;
  });
  return o;
}
function impOf(s){s=String(s||'');return s.includes('高')?'h':s.includes('低')?'l':'m'}
function statusOf(s){s=String(s||'');return (s.includes('回收')||s.includes('收尾')||s.includes('解決'))?'resolved':(s.includes('推進')||s.includes('發展'))?'developing':'planted'}
function parseOutput(txt,mode){
  const out={mode,events:[],foreshadows:[],states:[],quotes:[],errors:[]};
  const re=/【\s*([^】]+?)\s*】/g;let m;const heads=[];
  while((m=re.exec(txt)))heads.push({type:m[1],idx:m.index,start:re.lastIndex});
  if(!heads.length){out.fatal='找不到任何【區塊】標記，所以沒有讀出內容。請確認貼上的是 LLM 的整理結果，且每個區塊以【事件】【伏筆】這類標記開頭。若 LLM 改用了其他標題格式，請把指令重新貼給它，請它依格式重新輸出。';return out}
  const keys=[];
  let prevY=curY();
  const readTime=(raw,label)=>{
    let date=null,period=raw;const plus=raw.match(/[+＋]\s*(\d+)\s*天/);
    if(plus&&mode==='seg'){date=addDays(S.cur,+plus[1]);period=raw.replace(plus[0],'')}
    else{const p=parseDate(raw,prevY);if(p){date=p.date;period=p.rest}}
    if(!date){
      if(S.undated){out.errors.push(`${label}的時間無法辨識，請在下方填寫日期。`);return {date:null,period:clean(period)}}
      date={...S.cur};out.errors.push(`${label}的時間無法辨識，暫定為${fmt(date)}，請校正。`)}
    else if(!valid(date))out.errors.push(`${label}的日期「${fmt(date)}」在目前曆法中不存在，請校正。`);
    prevY=date.y;return {date,period:clean(period)};
  };
  heads.forEach((h,i)=>{
    const body=txt.slice(h.start,i+1<heads.length?heads[i+1].idx:txt.length);const f=fieldsOf(body,keys);const t=h.type;
    if(t.includes('事件')&&!f['摘要'])f['摘要']=f['內容']||f['描述']||'';
    if((t.includes('戲劇要素')||t.includes('伏筆')||t.includes('懸念')||t.includes('衝突'))&&!f['內容'])f['內容']=f['描述']||f['摘要']||'';
    if(t.includes('事件')){
      if(!f['摘要']){out.errors.push(`第 ${out.events.length+1} 個事件缺少「摘要」，已略過。`);return}
      const tm=readTime(f['時間']||'',`事件「${f['摘要'].slice(0,12)}…」`);
      out.events.push({dateText:fmt(tm.date),period:tm.period,place:f['地點']||'',chars:(f['角色']||'').trim(),summary:f['摘要'],imp:impOf(f['重要度'])});
    }else if(t.includes('戲劇要素')||t.includes('伏筆')||t.includes('懸念')||t.includes('衝突')){
      const kind=(f['類型']||'').includes('衝突')||(!f['類型']&&t.includes('衝突'))?'conflict':'foreshadow';
      const name=(f['名稱']||(f['內容']||'').slice(0,14)).trim();
      if(!name){out.errors.push('有一個戲劇要素缺少名稱與內容，已略過。');return}
      out.foreshadows.push({name,kind,status:statusOf(f['狀態']),content:f['內容']||'',chars:f['相關角色']||''});
    }else if(t.includes('台詞')||t.includes('對白')){
      const text=String(f['台詞']||'').replace(/^[「『"“]+|[」』"”]+$/g,'').trim();
      if(!text){out.errors.push('有一句台詞缺少內容，已略過。');return}
      const tm=readTime(f['時間']||'',`台詞「${text.slice(0,10)}…」`);
      out.quotes.push({dateText:fmt(tm.date),period:tm.period,speaker:f['說話者']||'',to:f['對象']||'',text,type:QT.find(x=>(f['類型']||'').includes(x))||'其他',why:f['原因']||''});
    }else if(t.includes('角色')){
      if(!f['角色']||!f['變化']){out.errors.push('有一筆角色狀態缺少角色或變化，已略過。');return}
      const cat=CATS.find(c=>(f['類別']||'').includes(c))||'心境';
      let target=f['對象']||'';if(/^僅|^無$|^－$|^-$/.test(target))target='';
      let act=f['動作']||'';if(/^僅|^無$|^－$|^-$/.test(act))act='';
      act=act.includes('失')||act.includes('交出')||act.includes('遺')?'失去':act.includes('得知')?'得知':act.includes('取')||act.includes('獲')?'取得':'';
      let subjects=f['當事人']||'';if(/^僅|^無$|^－$|^-$/.test(subjects))subjects='';
      let sid='';if(cat==='知情'){const ex=S.secrets.find(x=>x.text===(target||f['變化']).trim());sid=ex?ex.id:'new'}
      out.states.push({char:f['角色'],cat,target,act,change:f['變化'],subjects,sid});
    }
  });
  const total=out.events.length+out.foreshadows.length+out.states.length+out.quotes.length;
  if(!total){const uniq=[...new Set(keys)].slice(0,12);out.fatal=`找到 ${heads.length} 個【區塊】，但沒有讀出任何內容。${uniq.length?`工具讀到的欄位名稱是：${uniq.join('、')}。`:'區塊中找不到「欄位：內容」格式的文字。'}請確認欄位名稱與指令相同（例如「時間」「角色」「摘要」），或把指令重新貼給 LLM，請它依格式重新輸出。`}
  return out;
}
function commitParsed(){

    S.events.push({id:uid(),seg:n,date,period:e.period,place:e.place,chars,summary:e.summary,imp:e.imp,src:pro?'pro':'llm',order:++ord});
  });

function dayRecords(k){
  const ev=S.events.filter(x=>sortKey(x.date)===k),qs=S.quotes.filter(x=>sortKey(x.date)===k),hist=[],curs=[];

    let date=null;const raw=(o.start||'').trim();
    if(raw){const p=parseDate(raw,null);if(!p||p.date.prec!=='d'){toast('起始日期請填寫完整的年月日，或留空');return false}date=p.date}
    const s2=blankStory(o.name.trim()||`${pcs[0]}的故事`,defaultCal(),date);DB.stories[s2.id]=s2;
    setTimeout(()=>{switchStory(s2.id);pcs.forEach(n=>ensureChar(n,'self'));save();render();toast('已建立新故事')},0);
  },'曆法預設為標準公曆，建立後可在設定中更改。'),
  delStory:()=>askConfirm(`刪除「${S.name}」？此動作無法復原。`,()=>{delete DB.stories[DB.active];switchStory(Object.keys(DB.stories)[0])},'刪除'),
  exportData:async d=>{
    const scope=d&&d.scope==='all'?'all':'story';const {json,name,ids}=exportPayload(scope);
    try{const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup(ids);toast(scope==='all'?'已匯出全部故事':'已匯出這個故事');return}
    }catch(e){if(e&&e.name==='AbortError')return}
    ui.exportText=json;ui.exportIds=ids;ui.exportScope=scope;ui.tab='settings';render();toast('請複製備份內容另存');
  },
  copyExport:async()=>{if(await copy(ui.exportText,'已複製備份內容'))markBackup(ui.exportIds)},
  pickFile:()=>$('#fileIn').click(),
  copyRaw:()=>{let r='';try{r=localStorage.getItem(KEY)||localStorage.getItem(KEY+'-unreadable')||''}catch(e){}if(!r){toast('沒有可複製的資料');return}copy(r,'已複製原始資料，請貼到記事本保存')},
  importPaste:()=>{if(!ui.importText.trim()){toast('請先貼上備份內容');return}importJson(ui.importText)},
  resetTemplate:d=>{DB.settings[d.k]=d.k==='template'?DEFAULT_TEMPLATE:DEFAULT_PRO;save();render();toast('已還原預設指令')},
  clearAll:()=>askConfirm('清空所有故事與資料？此動作無法復原。',()=>{DB=firstDB();S=DB.stories[DB.active];resetUi();ui.tab='work';save();render()},'清空')
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a)}});
document.addEventListener('input',e=>{
  if(e.target.id==='accentPick'){applyAccent(e.target.value);return}
  const t=e.target;
  if(t.dataset.ui!==undefined)ui[t.dataset.ui]=t.value;
  else if(t.dataset.p){const [k,i,f]=t.dataset.p.split('.');ui.parsed[k][+i][f]=t.value}
  else if(t.dataset.st){S[t.dataset.st]=t.value;save();$('#storyName').textContent=S.name||'未命名故事'}
  else if(t.dataset.cal){
    const months=t.value.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const m=l.match(/^(.*?)\s*(\d+)\s*$/);if(!m)return null;const nm=m[1].trim();return {name:/^\d+月$/.test(nm)?'':nm,days:Math.min(1000,Math.max(1,+m[2]))}}).filter(Boolean);
    if(months.length){S.cal.months=months;save()}
  }
  else if(t.dataset.set){
    const k=t.dataset.set;
    if(k==='template'||k==='proTemplate')DB.settings[k]=t.value;
    save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='accentPick'){setAccent(t.value);return}
  if(t.name==='mv'){mvSync();return}
  if(t.id==='revN'){const n=Math.min(500,Math.max(1,parseInt(t.value,10)||20));DB.settings.reviewN=n;t.value=n;save();const pv=$('pre.prev');if(pv&&ui.showPrompt)pv.textContent=fillPrompt();return}
  if(t.dataset.uichk){ui[t.dataset.uichk]=t.checked}
  else if(t.dataset.uic){ui[t.dataset.uic]=t.value;render()}
  else if(t.dataset.story){switchStory(t.value)}
  else if(t.dataset.cal){render()}
  else if(t.dataset.stdate){const p=readDate(t.value);if(!p||p.date.prec!=='d'){if(p)toast('請填寫完整的年月日');t.value=S.undated?'':fmt(S[t.dataset.stdate]);return}if(S.undated)setFirstDate(p.date);else S[t.dataset.stdate]=p.date;save();render();toast('已更新日期')}
  else if(t.dataset.fsstatus){const f=S.foreshadows.find(x=>x.id===t.dataset.fsstatus);f.status=t.value;f.lastSeg=Math.max(f.lastSeg,curSeg());save();render();toast(`已改為「${FSN[t.value]}」`)}
  else if(t.dataset.chartype){const c=S.characters.find(x=>x.id===t.dataset.chartype);if(c&&CTYPE[t.value]){c.type=t.value;if(!c.profile)c.profile={};save();render();toast(`已改為${CTYPE[t.value]}`)}}
});
function syncTyping(){const a=document.activeElement;document.body.classList.toggle('typing',!!(a&&a!==document.body&&a.isConnected&&a.matches('input:not([type=checkbox]):not([type=file]):not([type=color]),textarea,select')))}
document.addEventListener('focusin',syncTyping);
document.addEventListener('focusout',()=>setTimeout(syncTyping,0));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
const HELP_PAGES=[
`<h3>歡迎使用Yarn Trifle敘線鬆糕</h3>
<p>故事越長越亂嗎？一起把每段劇情好好整理，隨時回顧吧！<span>૮ ᴖﻌᴖ ა</span></p>
<h4>整理只需要3步✨</h4>
<ol><li>在「工作台」點「複製整理指令」，貼到APP裡傳給AI。</li><li>複製AI的回覆，回到這裡貼上後點「解析」。</li><li>確認校對區的內容沒問題，就點「寫入」。</li></ol>
<p class="tip">小提醒：「回顧最近n則訊息」要從該段劇情的第一則開始算，日期才會對得上哦。</p>`,
`<h3>我可以做什麼？</h3>
<ul><li><b>時間軸</b>：依日期排好的事件和台詞。點一下事件展開，進行編輯、刪除或調整順序。</li><li><b>戲劇要素</b>：追蹤伏筆和衝突，看看哪些還沒收尾。</li><li><b>角色</b>：每個角色現在在哪裡、狀態如何，還有誰知道哪些秘密。</li><li><b>右下角的+號</b>：紀錄突然的點子，之後再到工作台歸類。</li></ul>
<h4>⚠️ 重要：記得備份</h4>
<p>資料只會存在自己的裝置（手機或電腦）中，不會上傳到任何地方。</p>
<p>瀏覽器可能會自動清掉網站資料，所以請定期到「設定」匯出備份。</p>`
];
// <p>如果你把敘線鬆糕加到iPhone主畫面，主畫面和瀏覽器裡的資料是分開的。使用前，記得先用備份把資料搬過去。</p>
function openHelp(i){
  i=Math.max(0,Math.min(HELP_PAGES.length-1,i||0));
  if((DB.settings.helpSeen||0)<HELP_VER){DB.settings.helpSeen=HELP_VER;save()}
  const last=i===HELP_PAGES.length-1;
  showSheet(`<div class="help"><p class="pg">${i+1}／${HELP_PAGES.length}</p>${HELP_PAGES[i]}
  <div class="row end" style="margin-top:18px">${i===0?'<button class="btn ghost" data-act="closeSheet">略過</button>':`<button class="btn ghost" data-act="help" data-p="${i-1}">上一步</button>`}${last?'<button class="btn primary" data-act="closeSheet">開始使用</button>':`<button class="btn primary" data-act="help" data-p="${i+1}">下一步</button>`}</div></div>`);
  const pn=$('#sheet .panel');if(pn)pn.scrollTop=0;
}
function boot(){
  try{render()}
  catch(e){
    console.error(e);
    $('#main').innerHTML=`<section class="sec"><h2>資料讀取失敗</h2><p class="hint">儲存的資料格式有問題，App 無法正常顯示。請先複製原始資料保存，再選擇重設；也可以重設後用正常的備份檔匯入。</p><div class="row"><button class="btn primary" data-act="copyRaw">複製原始資料</button><button class="btn danger" data-act="clearAll">重設</button></div></section>`;
  }
}
boot();
if((DB.settings.helpSeen||0)<HELP_VER)setTimeout(()=>openHelp(0),0);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});


</script>
<script>
(()=>{let last=window.scrollY,ticking=false;
  const upd=()=>{ticking=false;const y=Math.max(0,window.scrollY),b=document.body;
    if(b.classList.contains('typing'))syncTyping();
    const atEnd=y+innerHeight>=document.documentElement.scrollHeight-24;
    if(y<=60||atEnd)b.classList.remove('navhide');
    else if(y>last+6)b.classList.add('navhide');
    else if(y<last-6)b.classList.remove('navhide');
    if(Math.abs(y-last)>6||y<=60)last=y};
  addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(upd)}},{passive:true});
  const reveal=()=>{last=Math.max(0,window.scrollY);if(document.documentElement.scrollHeight<=innerHeight+80)document.body.classList.remove('navhide')};
  addEventListener('resize',reveal);
  new MutationObserver(reveal).observe(document.getElementById('main'),{childList:true});
})();
</script>
