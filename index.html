<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>對戲帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE3; --surface:#F4F5F1; --ink:#1E2433; --mute:#5C6373; --line:#C8CDC3;
  --jade:#3B7368; --jade-ink:#FFFFFF; --jade-soft:#D3E2DC;
  --seal:#AE402B; --seal-soft:#F0D9D1;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --surface:#1D232A; --ink:#E4E7E1; --mute:#9AA1AC; --line:#333B44;
    --jade:#72B3A5; --jade-ink:#0F1A17; --jade-soft:#22352F;
    --seal:#E27D65; --seal-soft:#3A2420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1D232A; --ink:#E4E7E1; --mute:#9AA1AC; --line:#333B44;
  --jade:#72B3A5; --jade-ink:#0F1A17; --jade-soft:#22352F;
  --seal:#E27D65; --seal-soft:#3A2420; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.story{flex:1;min-width:0}
.story h1{margin:0;font-family:var(--serif);font-weight:900;font-size:1.3rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story p{margin:0;color:var(--mute);font-size:.82rem}
.seal{flex:none;width:52px;height:52px;border:2px solid var(--seal);border-radius:4px;color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);line-height:1;transform:rotate(-3deg);background:var(--seal-soft)}
.seal small{font-size:.66rem;font-weight:600}
.seal b{font-size:1.25rem;font-weight:900;margin:2px 0}

main{max-width:680px;margin:0 auto;padding:6px 18px calc(110px + env(safe-area-inset-bottom,0px))}

/* sections */
.sec{padding:20px 0 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:1.12rem;display:flex;align-items:center;gap:10px}
.stepn{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--jade);color:var(--jade);font-family:var(--sans);font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sec.muted h2{color:var(--mute)}
.sec.muted .stepn{border-color:var(--line);color:var(--mute)}
.hint{margin:0 0 12px;color:var(--mute);font-size:.88rem}
h3.sub{margin:18px 0 8px;font-size:.95rem;font-weight:700;color:var(--mute)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:.95rem;cursor:pointer;min-height:42px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:700}
.btn.big{width:100%;min-height:52px;font-size:1.02rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row > .grow{flex:1}
.stack > * + *{margin-top:10px}

textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:110px;line-height:1.55}
pre.prev{white-space:pre-wrap;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;font-family:var(--sans);font-size:.85rem;max-height:260px;overflow:auto;margin:10px 0 0}

.notice{background:var(--seal-soft);border-left:3px solid var(--seal);padding:12px 14px;border-radius:0 10px 10px 0;margin:16px 0 0;font-size:.9rem}
.notice .row{margin-top:8px}
.ok{background:var(--jade-soft);border-left-color:var(--jade)}

/* segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:16px 0 4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;min-height:40px;font-size:.92rem;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--jade);color:var(--jade-ink);font-weight:700}
.seg button .n{font-size:.78rem;opacity:.8;margin-left:3px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--surface)}
button.chip{cursor:pointer;min-height:34px;padding:4px 12px;font-size:.88rem}
button.chip.on{border-color:var(--jade);background:var(--jade-soft);color:var(--ink);font-weight:700}

/* parsed preview */
.pitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--surface)}
.pitem .g{display:grid;grid-template-columns:72px 1fr 1fr;gap:6px}
.pitem .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pitem input,.pitem select,.pitem textarea{padding:7px 9px;border-radius:8px;background:var(--bg)}
.pitem textarea{min-height:60px;margin-top:6px}
.pitem .k{font-size:.75rem;color:var(--mute);display:block;margin-bottom:2px}
.pitem .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.82rem;color:var(--mute)}
.err{color:var(--seal);font-size:.85rem;margin:6px 0 0}

/* timeline */
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:16px 0 0}
.filters select{padding:8px 8px;font-size:16px}
.day{margin-top:22px}
.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dseal{font-family:var(--serif);color:var(--seal);border:1.5px solid var(--seal);border-radius:3px;padding:1px 8px;font-size:.85rem;font-weight:600;background:var(--seal-soft)}
.dseal b{font-size:1.05rem;font-weight:900;margin:0 2px}
.dayhead .rule{flex:1;height:1px;background:var(--line)}
.dayhead .cnt{font-size:.78rem;color:var(--mute)}
.ev{border-left:2px solid var(--line);margin-left:12px;padding:10px 0 10px 16px;position:relative}
.ev::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--mute)}
.ev.h::before{background:var(--seal);border-color:var(--seal)}
.ev.m::before{border-color:var(--jade)}
.ev-btn{all:unset;display:block;width:100%;cursor:pointer}
.ev-btn:focus-visible{outline:2px solid var(--jade);outline-offset:3px;border-radius:6px}
.ev .sum{font-size:1rem;line-height:1.55}
.ev .meta{font-size:.8rem;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.ev .chips{margin-top:6px}
.ev .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.imp-tag{color:var(--seal);font-weight:700}

/* list items */
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:700}
.item .desc{margin-top:2px}
.item .meta{font-size:.8rem;color:var(--mute);margin-top:4px}
.stale{display:inline-block;font-size:.75rem;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:500;vertical-align:2px}
.item .row{margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--jade);flex:none}
.done .desc{text-decoration:line-through;color:var(--mute)}

.card-draw{border:1.5px solid var(--jade);border-radius:12px;padding:18px;margin-top:12px;background:var(--jade-soft)}
.card-draw .cat{font-size:.8rem;color:var(--mute)}
.card-draw .txt{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin-top:4px}
ol.qs{margin:10px 0 0;padding-left:1.4em}
ol.qs li{margin:6px 0}

/* characters */
.char{border-bottom:1px solid var(--line)}
.char-btn{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;cursor:pointer}
.char-btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:1.1rem}
.char-btn .info{flex:1;min-width:0}
.char-btn .info b{display:block}
.char-btn .info span{font-size:.82rem;color:var(--mute)}
.chev{color:var(--mute);transition:transform .15s}
.char.open .chev{transform:rotate(90deg)}
.cdetail{padding:0 0 16px 52px}
.stt{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:.9rem}
.stt dt{color:var(--mute)}
.stt dd{margin:0}
.stt dd small{color:var(--mute)}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:.85rem}
.hist li{padding:5px 0;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start}
.hist li .t{flex:1}
.hist li .d{color:var(--mute);flex:none;font-size:.78rem;padding-top:2px}
.secret{padding:14px 0;border-bottom:1px solid var(--line)}
.secret .name{font-weight:700}
.secret .knows{font-size:.85rem;margin-top:6px}
.secret .knows span{color:var(--mute);margin-right:6px}
.chip.yes{border-color:var(--jade);color:var(--jade)}
.chip.no{color:var(--mute);border-style:dashed}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:transparent;padding:10px 2px 12px;min-height:56px;font-size:.82rem;color:var(--mute);cursor:pointer;position:relative}
.tab.on{color:var(--jade);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--jade)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (min-width:720px){.fab{right:calc(50% - 340px + 18px)}}
@media (max-width:760px){body.typing .tabbar,body.typing .fab{display:none}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.45)}
.panel{position:relative;width:100%;max-width:680px;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
.panel h3{margin:0 0 14px;font-family:var(--serif);font-size:1.15rem}
.fld{display:block;margin-bottom:12px}
.fld > span{display:block;font-size:.82rem;color:var(--mute);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--mute);text-align:center;padding:36px 10px;font-size:.92rem}
.small{font-size:.82rem;color:var(--mute)}

/* v2 additions */
.mdiv{display:flex;align-items:center;gap:10px;margin:30px 0 0;font-family:var(--serif);font-weight:900;font-size:1.05rem;color:var(--ink)}
.mdiv::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.18}
.gap{margin:14px 0 0 12px;padding:6px 0 6px 16px;border-left:2px dotted var(--mute);font-size:.8rem;color:var(--mute)}
.dseal.vague{border-style:dashed;background:transparent;color:var(--mute);border-color:var(--mute)}
.warn-tag{color:var(--seal);font-weight:700}
.modebar{margin-top:16px}
.prof{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;font-size:.9rem;margin:0 0 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.prof dt{color:var(--mute)}
.prof dd{margin:0}
.grp{margin:22px 0 2px;font-size:.85rem;font-weight:700;color:var(--mute)}
.typetag{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--mute);font-weight:500;vertical-align:2px}
.typetag.self{border-color:var(--jade);color:var(--jade)}
.avatar.other{background:transparent;border:1.5px dashed var(--mute);color:var(--mute)}
.seal small.mn{font-size:.62rem}
body.setup .tabbar,body.setup .fab,body.setup .seal{display:none}
.ev.q::before{border-radius:2px;background:var(--jade-soft);border-color:var(--jade);transform:rotate(45deg)}
.qt{font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.65}
.qtype{color:var(--jade);font-weight:700}
.fv{all:unset;cursor:pointer;border-bottom:1px dashed var(--mute);line-height:1.5}
.fv:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.chip.add{border-style:dashed;color:var(--jade);background:transparent}
.stt dd .chips{gap:5px}
.stt{row-gap:8px}
details.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
details.fold summary{cursor:pointer;font-size:.88rem;color:var(--mute);padding:6px 0;list-style-position:inside}
.improw{padding:12px 0;border-bottom:1px solid var(--line)}
.sec-btn{all:unset;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer}
.sec-btn .name{flex:1}
.sec-btn:focus-visible{outline:2px solid var(--jade);outline-offset:3px;border-radius:6px}
.chip.subj{border-color:var(--seal);color:var(--seal);background:var(--seal-soft)}
button.chip.subj{font-size:.85rem}
.chip.ck{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.chip.ck input{width:18px;height:18px;margin:0;accent-color:var(--jade)}
.chip.ck:has(input:checked){border-color:var(--jade);background:var(--jade-soft)}
.fld > .chips{margin-top:2px}
</style>
</head>

<header class="top"><div class="top-in">
  <div class="story"><h1 id="storyName">對戲帳本</h1><p id="storySub"></p></div>
  <div class="seal" aria-label="目前日期"><small class="mn" id="sealMn">1月</small><b id="sealNum">1</b><small>日</small></div>
</div></header>

<main id="main"></main>

<button class="fab" data-act="quickNote" aria-label="快速記錄">記</button>

  <button class="tab" data-act="tab" data-tab="work">工作台</button>
  <button class="tab" data-act="tab" data-tab="timeline">時間軸</button>
  <button class="tab" data-act="tab" data-tab="threads">伏筆與靈感</button>
  <button class="tab" data-act="tab" data-tab="chars">角色</button>
  <button class="tab" data-act="tab" data-tab="settings">設定</button>
</div></nav>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

    if(m&&(m[1]||prevY)){const mi=S.cal.months.findIndex(x=>x.name===m[2])+1,y=m[1]?+m[1]:prevY;return {date:m[3]?D(y,mi,+m[3]):Dm(y,mi),rest:str.replace(m[0],'')}}
  }
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d{1,5})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/)))return {date:D(+m[1],+m[2],+m[3]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年\s*(\d+)\s*月/)))return {date:Dm(+m[1],+m[2]),rest:str.replace(m[0],'')};
  if(prevY&&(m=str.match(/(\d+)\s*月\s*(\d+)\s*日/)))return {date:D(prevY,+m[1],+m[2]),rest:str.replace(m[0],'')};
  if((m=str.match(/(\d+)\s*年/)))return {date:Dy(+m[1]),rest:str.replace(m[0],'')};
  return null;
}

/* ---------- helpers ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}

const segLabel=n=>n===0?'序章':`第 ${n} 段`;

function newChar(name,type){return {id:uid(),name,type:type||'other',profile:{},cur:{single:{},rel:{},items:{'持有物':[],'知情':[]}},hist:[]}}
function ensureChar(name,type){name=String(name||'').trim();if(!name)return null;let c=S.characters.find(c=>c.name===name);if(!c){c=newChar(name,type);S.characters.push(c)}return c}
const LOSE_RE=/^(失去|遺失|交出|被奪|被奪走|丟失|用掉|消耗|移除|歸還)\s*[：:]?\s*/;
const GAIN_RE=/^(取得|獲得|得到|拿到|收到)\s*[：:]?\s*/;
function isLose(act,change){return /失去|遺失|交出|被奪|丟失|用掉|消耗|移除|歸還/.test(act||'')||(!act&&LOSE_RE.test(change||''))}

function applyState(c,st,date,seg){
  const cat=st.cat,h={id:uid(),cat,date:{...date},seg};

  else if(cat==='關係'){const t=st.target||'（未指定）';h.target=t;h.from=c.cur.rel[t]?c.cur.rel[t].v:'';h.to=st.change;c.cur.rel[t]={v:st.change,date:{...date}}}

    const list=c.cur.items['持有物'];
    if(isLose(st.act,st.change)){const nm=stripLose(st.change);const it=findItem(list,nm);if(it)c.cur.items['持有物']=list.filter(x=>x!==it);h.act='失去';h.to=it?it.v:nm}
    else{const nm=stripGain(st.change);list.push({id:uid(),v:nm,date:{...date}});h.act='取得';h.to=nm}
  }else if(cat==='知情'){
    let sec=st.sid&&st.sid!=='new'?secretById(st.sid):null;

    const note=st.target?st.change:'';

    if(!c.cur.items['知情'].some(x=>x.sid===sec.id))c.cur.items['知情'].push({id:uid(),sid:sec.id,note,date:{...date}});

function histText(h){
  if(h.act==='變更')return `${h.cat}：${h.from} → ${h.to}`;
  if(h.cat==='持有物')return `持有物：${h.act==='失去'?'－':'＋'}${h.to}`;
  if(h.cat==='知情'){const sec=h.sid&&secretById(h.sid);return `知情：${h.act==='移除'?'移除':'得知'}「${sec?sec.text:h.to}」${h.note?`（${h.note}）`:''}`}

}

/* ---------- parser ---------- */
function fieldsOf(body){const o={};body.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*[-*・]?\s*([^：:\s（(]{1,6})\s*[：:]\s*(.*)$/);if(m)o[m[1]]=m[2].trim()});return o}
function impOf(s){s=String(s||'');return s.includes('高')?'h':s.includes('低')?'l':'m'}
function statusOf(s){s=String(s||'');return s.includes('回收')?'resolved':(s.includes('推進')||s.includes('發展'))?'developing':'planted'}
function parseOutput(txt,mode){
  const out={mode,events:[],foreshadows:[],conflicts:[],states:[],quotes:[],errors:[]};
  const re=/【\s*([^】]+?)\s*】/g;let m;const heads=[];
  while((m=re.exec(txt)))heads.push({type:m[1],idx:m.index,start:re.lastIndex});
  if(!heads.length){out.errors.push('找不到任何【區塊】標記，請確認貼上的是 LLM 的整理結果。');return out}
  let prevY=S.cur.y;
  const readTime=(raw,label)=>{
    let date=null,period=raw;const plus=raw.match(/[+＋]\s*(\d+)\s*天/);
    if(plus&&mode==='seg'){date=addDays(S.cur,+plus[1]);period=raw.replace(plus[0],'')}
    else{const p=parseDate(raw,prevY);if(p){date=p.date;period=p.rest}}
    if(!date){date={...S.cur};out.errors.push(`${label}的時間無法辨識，暫定為${fmt(date)}，請校正。`)}
    else if(!valid(date))out.errors.push(`${label}的日期「${fmt(date)}」在目前曆法中不存在，請校正。`);
    prevY=date.y;return {date,period:clean(period)};
  };
  heads.forEach((h,i)=>{
    const body=txt.slice(h.start,i+1<heads.length?heads[i+1].idx:txt.length);const f=fieldsOf(body);const t=h.type;
    if(t.includes('事件')){
      if(!f['摘要']){out.errors.push(`第 ${out.events.length+1} 個事件缺少「摘要」，已略過。`);return}
      const tm=readTime(f['時間']||'',`事件「${f['摘要'].slice(0,12)}…」`);
      out.events.push({dateText:fmt(tm.date),period:tm.period,place:f['地點']||'',chars:(f['角色']||'').trim(),summary:f['摘要'],imp:impOf(f['重要度'])});
    }else if(t.includes('伏筆')){
      const name=f['名稱']||(f['內容']||'').slice(0,10);
      if(!name){out.errors.push('有一個伏筆缺少名稱與內容，已略過。');return}
      out.foreshadows.push({name,status:statusOf(f['狀態']),content:f['內容']||'',chars:f['相關角色']||''});
    }else if(t.includes('衝突')){
      if(f['內容'])out.conflicts.push({content:f['內容'],chars:f['相關角色']||''});
    }else if(t.includes('台詞')){
      const text=String(f['台詞']||'').replace(/^[「『"“]+|[」』"”]+$/g,'').trim();
      if(!text){out.errors.push('有一句台詞缺少內容，已略過。');return}
      const tm=readTime(f['時間']||'',`台詞「${text.slice(0,10)}…」`);
      out.quotes.push({dateText:fmt(tm.date),period:tm.period,speaker:f['說話者']||'',to:f['對象']||'',text,type:QT.find(x=>(f['類型']||'').includes(x))||'其他',why:f['原因']||''});
    }else if(t.includes('角色')){
      if(!f['角色']||!f['變化']){out.errors.push('有一筆角色狀態缺少角色或變化，已略過。');return}
      const cat=CATS.find(c=>(f['類別']||'').includes(c))||'心境';
      let target=f['對象']||'';if(/^僅|^無$|^－$|^-$/.test(target))target='';
      let act=f['動作']||'';if(/^僅|^無$|^－$|^-$/.test(act))act='';
      act=act.includes('失')||act.includes('交出')||act.includes('遺')?'失去':act.includes('得知')?'得知':act.includes('取')||act.includes('獲')?'取得':'';
      let subjects=f['當事人']||'';if(/^僅|^無$|^－$|^-$/.test(subjects))subjects='';
      let sid='';if(cat==='知情'){const ex=S.secrets.find(x=>x.text===(target||f['變化']).trim());sid=ex?ex.id:'new'}
      out.states.push({char:f['角色'],cat,target,act,change:f['變化'],subjects,sid});
    }
  });
  return out;
}
function commitParsed(){
  const p=ui.parsed;const pro=p.mode==='pro';const n=pro?0:curSeg()+1;
  let ord=maxOrder();const dates=[];let prevY=S.cur.y;
  p.events.forEach(e=>{
    const pd=parseDate(e.dateText,prevY);const date=pd?pd.date:{...S.cur};prevY=date.y;dates.push(date);
    const chars=splitNames(e.chars);chars.forEach(c=>ensureChar(c));
    S.events.push({id:uid(),seg:n,date,period:e.period,place:e.place,chars,summary:e.summary,imp:e.imp,src:pro?'pro':'llm',order:++ord});
  });
  p.quotes.forEach(q=>{const pd=parseDate(q.dateText,prevY);const date=pd?pd.date:{...S.cur};prevY=date.y;dates.push(date);[q.speaker,q.to].forEach(x=>splitNames(x).forEach(y=>ensureChar(y)));S.quotes.push({id:uid(),seg:n,date,period:q.period,speaker:q.speaker.trim(),to:q.to.trim(),text:q.text,type:q.type,why:q.why,done:false,order:++ord})});
  const sorted=dates.slice().sort((a,b)=>sortKey(a)-sortKey(b));
  const first=sorted[0],last=sorted[sorted.length-1];
  let endDate;
  if(pro){endDate=last?toExact(last):{...S.cur};if(last&&idx(endDate)>idx(S.cur))S.cur=endDate}
  else{endDate=last&&idx(last)>idx(S.cur)?toExact(last):{...S.cur}}
  const stateDate=pro?endDate:endDate;
  p.foreshadows.forEach(f=>{
    const ex=S.foreshadows.find(x=>x.name.trim()===f.name.trim());const chars=splitNames(f.chars);
    if(ex){ex.status=f.status;if(f.content)ex.content=f.content;ex.lastSeg=Math.max(ex.lastSeg,n);chars.forEach(c=>{if(!ex.chars.includes(c))ex.chars.push(c)})}
    else S.foreshadows.push({id:uid(),name:f.name,content:f.content,status:f.status,chars,plantedSeg:n,lastSeg:n});
  });
  p.conflicts.forEach(c=>{if(!S.conflicts.some(x=>x.content===c.content))S.conflicts.push({id:uid(),content:c.content,chars:splitNames(c.chars),resolved:false,seg:n})});
  p.states.forEach(s=>{const c=ensureChar(s.char);if(c)applyState(c,{cat:s.cat,target:s.target,act:s.act,change:s.change,subjects:s.subjects,sid:s.sid},stateDate,n)});
  if(pro){
    let seg=S.segments.find(s=>s.n===0);
    if(!seg){seg={id:uid(),n:0,startDate:first||{...S.cur},endDate:last||{...S.cur}};S.segments.unshift(seg)}
    else{if(first&&sortKey(first)<sortKey(seg.startDate))seg.startDate=first;if(last&&sortKey(last)>sortKey(seg.endDate))seg.endDate=last}
  }else{
    S.segments.push({id:uid(),n,startDate:{...S.cur},endDate});S.cur=endDate;
  }
  ui.parsed=null;ui.pasteText='';ui.justCommitted={n,label:segLabel(n)};
  save();render();window.scrollTo(0,0);
}

  const ex=s.sid&&s.sid!=='new'&&secretById(s.sid);

function charCard(c){
  const L=c.cur;const op=ui.charOpen===c.id;const self=c.type==='self';
  const loc=L.single['位置']?L.single['位置'].v:'位置未記錄';
  const qs=sortedEvents(S.quotes.filter(q=>q.speaker===c.name||splitNames(q.to).includes(c.name)));
  let h=`<div class="char ${op?'open':''}"><button class="char-btn" data-act="toggleChar" data-id="${c.id}" aria-expanded="${op}"><span class="avatar ${self?'':'other'}">${esc(c.name.slice(0,1))}</span><span class="info"><b>${esc(c.name)}<span class="typetag ${self?'self':''}">${self?'PC':'對方'}</span></b><span>${esc(loc)}</span></span><span class="chev">›</span></button>`;
  if(op){
    h+=`<div class="cdetail">`;
    if(self){
      const has=PROF.some(([k])=>c.profile&&c.profile[k]);
      h+=has?`<dl class="prof">${PROF.map(([k,l])=>c.profile[k]?`<dt>${l}</dt><dd>${esc(c.profile[k])}</dd>`:'').join('')}</dl>`:`<p class="hint">尚未填寫角色設定。</p>`;
    }else h+=`<p class="hint">對方角色只記錄劇情中表現出來的狀態，不保存設定。</p>`;
    h+=`<p class="small" style="margin:0 0 6px">點擊內容即可修改</p><dl class="stt">`;
    SINGLE.forEach(k=>{const v=L.single[k];h+=`<dt>${k}</dt><dd><button class="fv" data-act="editField" data-c="${c.id}" data-cat="${k}">${v?esc(v.v):'<span class="small">未記錄</span>'}</button>${v?` <small>${esc(fmt(v.date))}</small>`:''}</dd>`});
    Object.entries(L.rel).forEach(([t,s])=>{h+=`<dt>對${esc(t)}</dt><dd><button class="fv" data-act="editRel" data-c="${c.id}" data-t="${esc(t)}">${esc(s.v)}</button> <small>${esc(fmt(s.date))}</small></dd>`});
    h+=`<dt>關係</dt><dd><button class="chip add" data-act="addRel" data-c="${c.id}">＋ 新增對象</button></dd>`;
    h+=`<dt>持有物</dt><dd><div class="chips">${L.items['持有物'].map(it=>`<button class="chip" data-act="editItem" data-c="${c.id}" data-cat="持有物" data-id="${it.id}">${esc(it.v)}</button>`).join('')}<button class="chip add" data-act="addItem" data-c="${c.id}" data-cat="持有物" aria-label="新增持有物">＋</button></div></dd>`;
    const subjOf=S.secrets.filter(x=>x.subjects.includes(c.name));
    h+=`<dt>知情</dt><dd><div class="chips">${subjOf.map(x=>`<button class="chip subj" data-act="editSecret" data-id="${x.id}">當事人｜${esc(x.text)}</button>`).join('')}${L.items['知情'].map(it=>{const sec=secretById(it.sid);return sec?`<button class="chip" data-act="editKnow" data-c="${c.id}" data-id="${it.id}">${esc(sec.text)}</button>`:''}).join('')}<button class="chip add" data-act="addKnow" data-c="${c.id}" aria-label="新增知情">＋</button></div></dd>`;
    h+=`</dl>
    <details class="fold"><summary>變化歷程（${c.hist.length}）</summary>${c.hist.length?`<ul class="hist">${c.hist.slice().sort((a,b)=>sortKey(b.date)-sortKey(a.date)).map(x=>`<li><span class="t">${esc(histText(x))}</span><span class="d">${esc(fmt(x.date))}</span><button class="btn sm ghost" data-act="delHist" data-c="${c.id}" data-id="${x.id}" aria-label="刪除此紀錄">✕</button></li>`).join('')}</ul>`:'<p class="small">尚無變化紀錄。</p>'}</details>
    ${qs.length?`<details class="fold"><summary>相關台詞（${qs.length}）</summary><ul class="hist">${qs.map(q=>`<li><span class="t">${esc(q.speaker)}${q.to?' → '+esc(q.to):''}：「${esc(q.text)}」</span><span class="d">${esc(fmt(q.date))}</span></li>`).join('')}</ul></details>`:''}
    <div class="row" style="margin-top:12px">${self?`<button class="btn sm primary" data-act="editProfile" data-id="${c.id}">編輯設定</button>`:''}<button class="btn sm" data-act="toggleType" data-id="${c.id}">改為${self?'對方':'PC'}</button><button class="btn sm" data-act="renameChar" data-id="${c.id}">改名</button><button class="btn sm danger" data-act="delChar" data-id="${c.id}">刪除</button></div></div>`;
  }
  return h+'</div>';
}
function vChars(){
  let h=`<div class="seg"><button class="${ui.charView==='list'?'on':''}" data-act="set" data-k="charView" data-v="list">角色狀態</button><button class="${ui.charView==='know'?'on':''}" data-act="set" data-k="charView" data-v="know">誰知道什麼</button></div>`;
  if(ui.charView==='list'){
    h+=`<div class="row end" style="margin-top:10px"><button class="btn sm" data-act="addChar">新增角色</button></div>`;
    if(!S.characters.length)return h+`<p class="empty">還沒有角色。匯入時會自動建立為對方角色，也可以手動新增。</p>`;
    const mine=S.characters.filter(c=>c.type==='self'),theirs=S.characters.filter(c=>c.type!=='self');
    h+=`<div class="grp">PC</div>`+(mine.length?mine.map(charCard).join(''):'<p class="hint">尚無 PC。展開角色後可切換為 PC。</p>');
    h+=`<div class="grp">對方</div>`+(theirs.length?theirs.map(charCard).join(''):'<p class="hint">尚無對方角色。</p>');
  }else{
    h+=`<div class="row" style="margin-top:12px"><p class="hint grow" style="margin:0">點擊秘密即可編輯內容、當事人與知情者。</p><button class="btn sm" data-act="addSecret">新增秘密</button></div>`;
    if(!S.secrets.length)return h+`<p class="empty">還沒有秘密。匯入「知情」類別的角色狀態時會自動建立，也可以手動新增。</p>`;
    S.secrets.forEach(sec=>{
      const kn=knowersOf(sec);const un=S.characters.filter(c=>!sec.subjects.includes(c.name)&&!kn.includes(c));
      const notes=kn.map(c=>{const it=c.cur.items['知情'].find(x=>x.sid===sec.id);return it&&it.note?`${c.name}：${it.note}（${fmt(it.date)}）`:''}).filter(Boolean);
      h+=`<div class="secret"><button class="sec-btn" data-act="editSecret" data-id="${sec.id}"><span class="name">${esc(sec.text)}</span><span class="chev">›</span></button>
      ${sec.subjects.length?`<div class="knows"><span>當事人</span><span class="chips" style="display:inline-flex">${sec.subjects.map(n=>`<span class="chip subj">${esc(n)}</span>`).join('')}</span></div>`:''}
      <div class="knows"><span>知情</span><span class="chips" style="display:inline-flex">${kn.length?kn.map(c=>`<span class="chip yes">${esc(c.name)}</span>`).join(''):'<span class="small">－</span>'}</span></div>
      ${notes.length?`<div class="small" style="margin-top:4px">${notes.map(esc).join('<br>')}</div>`:''}
      ${un.length?`<div class="knows"><span>不知情</span><span class="chips" style="display:inline-flex">${un.map(c=>`<span class="chip no">${esc(c.name)}</span>`).join('')}</span></div>`:''}</div>`;
    });
  }
  return h;
}

let formCb=null,confirmCb=null;
function showSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;const f=$('#sheetBody').querySelector('input,textarea');if(f)setTimeout(()=>f.focus(),60)}

let formExtraCb=null;
function openForm(title,fields,vals,cb,note,extra){
  formCb=cb;formExtraCb=extra?extra.cb:null;
  showSheet(`<h3>${esc(title)}</h3>${note?`<p class="hint">${esc(note)}</p>`:''}`+fields.map(f=>{
    const v=vals[f.k]??'';let inp;
    if(f.t==='textarea')inp=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if(f.t==='select')inp=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else inp=`<input name="${f.k}" type="text" value="${esc(v)}">`;
    return `<label class="fld"><span>${esc(f.l)}</span>${inp}</label>`;
  }).join('')+`<div class="row">${extra?`<button class="btn danger" data-act="formExtra">${esc(extra.label)}</button>`:''}<span style="flex:1"></span><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn primary" data-act="saveForm">儲存</button></div>`);

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
function markBackup(){DB.lastBackup=new Date().toISOString();ui.justCommitted=null;save();render()}
let pendingImport=null;
function importJson(text){
  let raw;try{raw=JSON.parse(text)}catch(e){toast('無法讀取：內容不是有效的備份格式');return}
  let d=null;try{d=cleanDB(raw)}catch(e){d=null}
  if(!d){toast('無法讀取：缺少故事資料');return}
  pendingImport=d;
  const rows=Object.keys(d.stories).map(id=>{
    const st=d.stories[id],ex=DB.ready!==false?DB.stories[id]:null;
    let note='新故事，將加入',older=false;
    if(ex){older=!!(st.updatedAt&&ex.updatedAt&&new Date(st.updatedAt)<new Date(ex.updatedAt));note=`將覆蓋目前的「${ex.name}」`+(st.updatedAt&&ex.updatedAt?(older?'（備份較舊）':'（備份較新）'):'')}
    return `<label class="check improw"><input type="checkbox" name="imp" value="${esc(id)}" ${older?'':'checked'}><span><b>${esc(st.name||'未命名故事')}</b><div class="small">${esc(note)}　${cArr(st.events).length} 個事件</div></span></label>`;
  }).join('');
  showSheet(`<h3>匯入備份</h3><p class="hint">勾選要匯入的故事。沒有勾選的、以及備份裡沒有的故事都會保留，不受影響。</p>${rows}
  <div class="row" style="margin-top:16px"><button class="btn sm danger" data-act="importReplaceAll">全部取代</button><span style="flex:1"></span><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn primary" data-act="importMerge">匯入勾選的故事</button></div>`);
}

$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJson(r.result);r.readAsText(f);e.target.value=''});

    showSheet(`<h3>編輯秘密</h3>
    <label class="fld"><span>內容（所有相關角色同步更新）</span><textarea id="secText" rows="3">${esc(sec.text)}</textarea></label>
    <div class="fld"><span>當事人：與這件事直接相關的人，自動視為知情</span><div class="chips">${box('subj',sec.subjects)}</div></div>
    <div class="fld"><span>知情者：從劇情中得知的人（同時勾選為當事人者以當事人為準）</span><div class="chips">${box('know',kn)}</div></div>
    <div class="row end"><button class="btn ghost" data-act="closeSheet">取消</button><button class="btn primary" data-act="saveSecret" data-id="${sec.id}">儲存</button></div>
    ${others.length?`<h3 class="sub">合併</h3><p class="hint">把這個秘密併入另一個，當事人與知情者會一起合併，這個秘密的內容會被捨棄。</p>
    <div class="row"><select id="secMerge" style="flex:1">${others.map(x=>`<option value="${x.id}">${esc(x.text)}</option>`).join('')}</select><button class="btn sm" data-act="mergeSecret" data-id="${sec.id}">合併</button></div>`:''}
    <div class="row" style="margin-top:18px"><button class="btn sm danger" data-act="delSecret" data-id="${sec.id}">刪除這個秘密</button></div>`);
  },
  saveSecret:d=>{
    const sec=secretById(d.id);const body=$('#sheetBody');
    const t=body.querySelector('#secText').value.trim();if(!t){toast('請填寫內容');return}
    if(t!==sec.text&&S.secrets.some(x=>x!==sec&&x.text===t)){toast('已有相同內容的秘密，請改用「合併」');return}
    const subj=[...body.querySelectorAll('input[name=subj]:checked')].map(x=>x.value);
    const know=[...body.querySelectorAll('input[name=know]:checked')].map(x=>x.value);
    sec.text=t;sec.subjects=subj;
    S.characters.forEach(c=>{
      const has=c.cur.items['知情'].some(x=>x.sid===sec.id);
      if(know.includes(c.name)&&!subj.includes(c.name)&&!has)c.cur.items['知情'].push({id:uid(),sid:sec.id,note:'',date:{...S.cur}});
      if(!know.includes(c.name)&&has)c.cur.items['知情']=c.cur.items['知情'].filter(x=>x.sid!==sec.id);
    });
    normSecrets();closeSheet();save();render();toast('已更新秘密');
  },
  mergeSecret:d=>{
    const sec=secretById(d.id);const tid=$('#sheetBody').querySelector('#secMerge').value;const tgt=secretById(tid);if(!tgt)return;
    askConfirm(`把「${sec.text}」併入「${tgt.text}」？`,()=>{
      sec.subjects.forEach(n=>{if(!tgt.subjects.includes(n))tgt.subjects.push(n)});
      S.characters.forEach(c=>{
        const list=c.cur.items['知情'];const a=list.find(x=>x.sid===sec.id),b=list.find(x=>x.sid===tgt.id);
        if(a&&b){if(!b.note&&a.note)b.note=a.note;c.cur.items['知情']=list.filter(x=>x!==a)}else if(a)a.sid=tgt.id;
        c.hist.forEach(h=>{if(h.sid===sec.id)h.sid=tgt.id});
      });
      S.secrets=S.secrets.filter(x=>x!==sec);normSecrets();save();render();toast('已合併');
    },'合併');
  },
  delSecret:d=>{const sec=secretById(d.id);askConfirm(`刪除「${sec.text}」？所有角色的這筆知情也會一併移除。`,()=>{
    S.characters.forEach(c=>{c.cur.items['知情']=c.cur.items['知情'].filter(x=>x.sid!==sec.id)});S.secrets=S.secrets.filter(x=>x!==sec);save();render();
  },'刪除')},
  delHist:d=>{const c=S.characters.find(x=>x.id===d.c);c.hist=c.hist.filter(h=>h.id!==d.id);save();render()},
  formExtra:()=>{const o={};$('#sheetBody').querySelectorAll('[name]').forEach(el=>o[el.name]=el.value);const cb=formExtraCb;closeSheet();if(cb&&cb(o)!==false){save();render()}},
  useNewTpl:()=>{DB.settings.template=DEFAULT_TEMPLATE;DB.settings.proTemplate=DEFAULT_PRO;delete DB.settings.tplNotice;save();render();toast('已改用新版範本')},
  keepTpl:()=>{delete DB.settings.tplNotice;save();render()},
  importMerge:()=>{
    const ids=[...$('#sheetBody').querySelectorAll('input[name=imp]:checked')].map(x=>x.value);
    if(!ids.length){toast('請至少勾選一個故事');return}
    const d=pendingImport;
    if(DB.ready===false){DB.stories={};DB.ready=true}
    ids.forEach(id=>{DB.stories[id]=d.stories[id]});
    if(!DB.stories[DB.active])DB.active=ids[0];
    S=DB.stories[DB.active];migrateAll();
    closeSheet();resetUi();ui.importText='';pendingImport=null;save();render();
    toast(`已匯入 ${ids.length} 個故事，其他故事保留不變`);
  },
  importReplaceAll:()=>askConfirm('全部取代會刪除目前所有故事與設定，改為備份中的內容，確定嗎？',()=>{
    const d=pendingImport;d.ready=true;if(!d.settings)d.settings=defaultSettings();if(!d.stories[d.active])d.active=Object.keys(d.stories)[0];
    DB=d;S=DB.stories[DB.active];migrateAll();resetUi();ui.importText='';pendingImport=null;save();render();toast('已取代為備份內容');
  },'全部取代'),
  closeSheet:()=>closeSheet(),
  saveForm:()=>{const o={};$('#sheetBody').querySelectorAll('[name]').forEach(el=>o[el.name]=el.value);if(formCb&&formCb(o)===false)return;closeSheet();save();render()},
  confirmYes:()=>{const cb=confirmCb;closeSheet();cb&&cb()},
  setupDone:()=>{
    const name=$('#suName').value.trim()||'我的故事';
    S.cal.type=$('#suCal').value;
    const p=parseDate($('#suStart').value,null);
    if(!p||p.date.prec!=='d'){toast('請填寫完整的起始日期，例如 1892年2月26日');return}
    if(!valid(p.date)){toast(`「${fmt(p.date)}」在目前曆法中不存在`);return}
    S.name=name;S.start=p.date;S.cur={...p.date};
    splitNames($('#suSelf').value).forEach(n=>ensureChar(n,'self'));
    DB.ready=true;save();render();toast('故事已建立');
  },
  setCal:d=>{S.cal.type=d.v;if(!S.cal.months||!S.cal.months.length)S.cal.months=defaultCal().months;save();render();const b=invalidCount();toast(b?`切換完成，有 ${b} 筆日期在此曆法中不存在`:'已切換曆法')},
  newStory:()=>openForm('新增故事',[{k:'name',l:'故事名稱'},{k:'start',l:'故事起始日期（如 1892年2月26日）'}],{},o=>{
    const p=parseDate(o.start,null);if(!p||p.date.prec!=='d'){toast('請填寫完整的起始日期');return false}
    const s=blankStory(o.name.trim(),defaultCal(),p.date);DB.stories[s.id]=s;setTimeout(()=>{switchStory(s.id);toast('已建立新故事')},0);
  },'曆法預設為標準公曆，建立後可在設定中更改。'),
  delStory:()=>askConfirm(`刪除「${S.name}」？此動作無法復原。`,()=>{delete DB.stories[DB.active];switchStory(Object.keys(DB.stories)[0])},'刪除'),
  exportData:async()=>{
    const json=JSON.stringify(Object.assign({},DB,{exportedAt:new Date().toISOString()}));
    const name=`對戲帳本_${stamp()}.json`;
    try{const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();toast('已匯出備份');return}
    }catch(e){if(e&&e.name==='AbortError')return}
    ui.exportText=json;ui.tab='settings';render();toast('請複製備份內容另存');
  },
  copyExport:async()=>{if(await copy(ui.exportText,'已複製備份內容'))markBackup()},
  pickFile:()=>$('#fileIn').click(),
  copyRaw:()=>{let r='';try{r=localStorage.getItem(KEY)||localStorage.getItem(KEY+'-unreadable')||''}catch(e){}if(!r){toast('沒有可複製的資料');return}copy(r,'已複製原始資料，請貼到記事本保存')},
  importPaste:()=>{if(!ui.importText.trim()){toast('請先貼上備份內容');return}importJson(ui.importText)},
  resetTemplate:d=>{DB.settings[d.k]=d.k==='template'?DEFAULT_TEMPLATE:DEFAULT_PRO;save();render();toast('已還原預設指令')},
  clearAll:()=>askConfirm('清空所有故事與資料？此動作無法復原。',()=>{DB=firstDB();S=DB.stories[DB.active];resetUi();ui.tab='work';save();render()},'清空')
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui!==undefined)ui[t.dataset.ui]=t.value;
  else if(t.dataset.p){const [k,i,f]=t.dataset.p.split('.');ui.parsed[k][+i][f]=t.value}
  else if(t.dataset.st){S[t.dataset.st]=t.value;save();$('#storyName').textContent=S.name||'未命名故事'}
  else if(t.dataset.cal){
    const months=t.value.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const m=l.match(/^(.*?)\s*(\d+)\s*$/);if(!m)return null;const nm=m[1].trim();return {name:/^\d+月$/.test(nm)?'':nm,days:Math.min(1000,Math.max(1,+m[2]))}}).filter(Boolean);
    if(months.length){S.cal.months=months;save()}
  }
  else if(t.dataset.set){
    const k=t.dataset.set;
    if(k==='template'||k==='proTemplate')DB.settings[k]=t.value;
    else if(k==='questions')DB.settings.questions=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(k==='cards'){const o={};t.value.split('\n').forEach(l=>{const m=l.match(/^\s*([^：:]+)[：:]\s*(.+)$/);if(m)(o[m[1].trim()]=o[m[1].trim()]||[]).push(m[2].trim())});DB.settings.cards=o;ui.qs=null}
    save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.uichk){ui[t.dataset.uichk]=t.checked}
  else if(t.dataset.uic){ui[t.dataset.uic]=t.value;render()}
  else if(t.dataset.story){switchStory(t.value)}
  else if(t.dataset.cal){render()}
  else if(t.dataset.stdate){const p=readDate(t.value);if(!p||p.date.prec!=='d'){if(p)toast('請填寫完整的年月日');t.value=fmt(S[t.dataset.stdate]);return}S[t.dataset.stdate]=p.date;save();render();toast('已更新日期')}
  else if(t.dataset.fsstatus){const f=S.foreshadows.find(x=>x.id===t.dataset.fsstatus);f.status=t.value;f.lastSeg=Math.max(f.lastSeg,curSeg());save();render();toast(`已改為「${FSN[t.value]}」`)}
  else if(t.dataset.cf){const c=S.conflicts.find(x=>x.id===t.dataset.cf);c.resolved=t.checked;save();render()}
});
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=checkbox]),textarea,select'))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>document.body.classList.remove('typing'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function boot(){
  try{migrateAll();render()}
  catch(e){
    console.error(e);
    $('#main').innerHTML=`<section class="sec"><h2>資料讀取失敗</h2><p class="hint">儲存的資料格式有問題，App 無法正常顯示。請先複製原始資料保存，再選擇重設；也可以重設後用正常的備份檔匯入。</p><div class="row"><button class="btn primary" data-act="copyRaw">複製原始資料</button><button class="btn danger" data-act="clearAll">重設</button></div></section>`;
  }
}
boot();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

</script>
